  llm_judge_prompt:
  - step_2 event 분류 + step_3 materiality (multi_event_rule 포함 — secondary 태그 보존)
  - 'primary_event 선택 검증: 발행·조달이 IPO 거래 구성요소인지 별건 유증인지 본문으로 판별'
  - dilution certainty_ladder 판정 (검토/이사회결의/공시 구분 — 본문 근거 필요)
  - capital_structure_direction 최종 판정 + 서술 규칙 (reduction을 희석 증가로 서술 금지)
  - 'equity_grant materiality: 완전희석주식수 대비 부여 비율 판단 (1% 미만 루틴=normal)'
  - 'authorized_capacity materiality: 확대 배율·절대 규모 판단'
  - 'overhang materiality: 해제 수량·발행주식/유통주식 대비 비율·보유자·매각 개연성'
  - technology_milestone importance_criteria 충족 여부 (수치·외부검증 존재 판단)
  - 'technology_setback materiality: 지연 기간·프로젝트 중요도·사업 영향 판단'
  - 'pr_gate: pr_gated_terms 기사에서 evidence_required_any 존재 여부 판단 (LEAK-19)'
  - IPO stage_priority 층 적용 + speculation_guard (회사 확인 없는 관측 하향)
  - schedule_not_rumor 예외 적용 (의무보유·보호예수 해제 예정 포함)
  - state_transition vs rumor / downgrade_markers(따상 포함) / conference 신규 데이터 여부
  - 'BT2-2: 출자전환 이중 효과 서술 (희석 + 채무감소 병기 — 순부정 서술 금지)'
  - 'BT2-8: event_lifecycle no_promotion — 명시 단계 초과 서술·분류 금지'
  - 'BT3-4: polarity_guards 4종 적용 (부인 프레이밍·부실 당사자 방향·완곡어·논조 분리)'
  - 'BT3-5: 개발계약형 bio 딜의 urgent 판정 (기술이전 어휘 부재 시에도 실질 라이선스면 승격)'
  - 'BT3-10: 한 기사 내 복수 사건 분리 추출 + 동일 거래 양면 연결'
  - 'BT3-11: 기사·IR에서 ''기한 있는 공표 마일스톤'' 추출 (마일스톤 + 시점 표현)'
  - 'BT3-1b: 감사의견 심각도 판정 (적정 → important / 한정·의견거절·계속기업 → urgent)'
  - 구다이글로벌 acquirer/target 방향성
  - counterparty/partner_watch 기사 영향도 판별 (해지·종료 기사의 당사자 방향 포함)
  - company_update 서브타입 부여 + passing_mention 판별 (기사 주제가 회사인지 스치는 언급인지 — 제목·리드 문단 내 위치와 서술 비중으로 판단)
  - management_change 직급·역할 materiality (C-level/창업자 vs 실무급)
  - workforce_change 규모·방향 판단 (감원 규모, 재무 구조조정 vs 인력 구조조정)
  - customer_loss 규모 판단 (대형 고객 여부, 자연 만기 vs 중도 해지)
  - governance 감사의견·주주제안 심각도 / corporate_structure 물적분할 가치이전 리스크
  - retention 판정 — discard는 discard_only_if 5사유에 해당할 때만, 그 외 전부 보존
  - 'v4.5 EXT: external materiality 판정 — broad industry commentary와 actual material external event 구분'
  - 'v4.5 EXT: causal mechanism judge — event→exposure→company 연결을 한 문장으로 설명하고 impact_direction + mechanisms + confidence 출력'
  - 'v4.5 EXT: party_direction_check — 규제/거래 직접 당사자와 ecosystem-exposed portfolio company를 혼동하지 않음'
  - 'v4.5 EXT: comparable peer similarity 판정 — same-industry만으로 peer 인정 금지'
  tests:
  - 'entity gate·context_required·negative_context·정규식·direction 매핑·dedup 키: pytest 결정적 실행 (API 호출 없음)'
  - 'materiality·certainty_ladder·pr_gate·setback materiality·multi-event 보존: 골든셋 평가 스크립트 (judge 소량 실호출, 수동/주기 실행)'
  - 'v4.5 EXT: external_impact_regression_tests — historical positive 35 + synthetic negative 12, shadow-mode golden suite'
  - 'v4.5 EXT: 기존 regression_tests 181건 byte-equivalent semantic preservation 검사'
  - 'v4.5 EXT: external exposure lint — exposure_id unique, valid_from ISO date, evidence URL, allowed family 존재, broad-industry-only subject
    금지'
  schema_lints:
    lifecycle_completeness: 'lifecycle을 정의하는 모든 목록(ipo_stages·ma.lifecycle_stages· tech_evaluation·facility 단계·공모 절차 등)은 대응하는 실패/철회/중간 상태를 명시하거나
      ''failure_states: none — reviewed <사유>'' 주석을 달아야 한다. 둘 다 없으면 lint 실패. (근거: 통과↔탈락, 발행↔풋옵션, 상장↔관리종목, 착공↔건립결정, 공모↔풋백옵션 — 동일 비대칭이 5회 재발)'
    cross_family_guard_consistency: '같은 토큰이 복수 패밀리 ko/en 목록에 등장하면 각 등장처가 (a) 자체 context_required 가드를 갖거나 (b) ''guard_exempt: <사유>'' 주석을 달아야 한다.
      가드는 상속되지 않는다 — 본계약(ma 가드/partnership 무가드), 실시권(bio 가드/partnership 무가드) 실측 재발 차단'
    comment_vocab_desync: 스키마 산문·주석에 등장하는 한국어 사건 명사 중 어떤 어휘 목록(*_ko/terms/patterns_ko)에도 없는 것을 리포트 — '건립'이 주석 4회· 어휘 0회로 committed_milestone 트리거를
      반쪽 상태로 만들던 클래스. (경고 수준 — 모든 산문 명사가 어휘일 필요는 없으므로 fail이 아니라 review 큐)
    external_exposure_integrity: 모든 external_exposure는 exposure_id/type/subject/valid_from/evidence/confidence/allowed_event_families 필수. exposure_id
      전역 unique, valid_from ISO date, allowed family는 external_impact_logic.event_families에 존재해야 함.
    external_broad_term_guard: AI/인공지능/반도체/바이오/로봇/핀테크/커머스 같은 broad industry 단독 subject/query는 fail. specific policy/standard/entity/target/material/platform으로
      좁혀야 함.
    external_time_guard: historical strict test의 event_date가 exposure.valid_from보다 이르면 fail 또는 oracle로 명시되어야 함.
