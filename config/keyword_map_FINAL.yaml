        - 보호예수·락업·의무보유등록 해제 예정 (해제일은 계약·규정상 확정된 미래 사건)
        - 수요예측·청약 일정 예고 (증권신고서 제출 후 일정 보도)
        rule: 사건 자체가 이미 확정 절차에 들어간 뒤의 일정 표현이면 confirmed로 취급
      dilution_not_blanket_downgraded:
        rule: capital_structure_dilution 패밀리는 '검토/추진' 단계도 확실성 사다리 (certainty_ladder)로 별도 판정 — 블랭킷 루머 하향 적용 금지
      ipo_plan_is_important_not_urgent:
        rule: 회사가 직접 밝힌 IPO 계획·목표·검토는 하향해서 버리지 않는다 — ipo.stage_priority에 따라 important로 유지. 반면 회사 확인 없는 매체·커뮤니티발 IPO 관측은 unsupported_speculation으로
          하향
  event_lifecycle:
    stages:
    - candidate
    - discussion
    - planned
    - filed
    - approved
    - signed
    - completed
    - commercialized
    no_promotion_rule: 기사에 명시된 단계보다 후행 단계로 서술·분류하지 않는다. '체결 논의 중' → discussion (partnership 후보 intelligence로 보존, '체결'로 서술 금지). 'LOI 체결' → signed(LOI)
      — 본계약 체결로 승격 금지. '예심 청구 계획' → planned — filed로 승격 금지. certainty_ladder·rumor_or_expectation·speculation_guard와 정합 — 이 규칙은 그 판정들의 공통 서술 원칙이다
    retention_rule: 미체결 BD 논의·계획 단계 정보는 허위 승격 없이 intelligence로 보존 (notification은 단계·확실성 기준, retention은 보존이 기본값) — material-event-only 시스템으로의 후퇴
