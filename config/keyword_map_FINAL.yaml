    - pops on debut
    note: downgrade_marker가 있어도 기사 안에 회사 발표·공시·이사회 결의 등 1차 근거가 인용되어 있으면 사건 자체는 살리고 중복 제거로 원 기사를 우선한다. 따상 기사의 기저 사건(신규상장)이 아직 미보고 상태면 ipo/신규상장으로
      catch하되, 따상 자체가 별도의 urgent 펀더멘털 사건을 만들면 안 된다
priority_levels:
  urgent:
    description: material event with direct financing, dilution, ownership, regulatory, clinical, commercial, legal, or strategic impact — 즉시
      푸시
  important:
    description: meaningful technology milestone or setback, product, partnership, market expansion, credible prospective dilution, IPO preparation
      stage, key-person change, or operating milestone — 푸시/하이라이트
  normal:
    description: routine PR, minor product updates, company updates, executive commentary, conference attendance without new data — 푸시 없음, 피드·주간
      다이제스트 보존. normal은 수집 실패나 폐기 사유가 아니다
  none:
    description: notification 없음 — retention_policy가 보존 여부를 별도 결정 (speculation 플래그 보존, 반복 PR 접힘 보존 등)
  ignore_deprecated:
    description: v4.1까지의 ignore(소멸)는 v4.2에서 notification=none + retention 분리로 대체됨. 구 테스트 호환을 위해 유지 — discard 의미로는 pipeline.discard_only_if만 유효
investor_priority_philosophy:
  ranked_impact_order:
    1: ownership / share count (희석·지배구조)
    2: corporate financing
    3: IPO / liquidity event
    4: M&A / control
    5: regulatory or clinical outcome
    6: fundamental technological de-risking (or setback)
    7: commercialization / customer validation
    8: major contracts / partnerships
    9: earnings trajectory
    10: ordinary PR
  rule: '자본구조·희석 리스크는 일반 기술/제품 뉴스보다 항상 상위. 복수 사건 매치 시 상위 서열 사건이 primary_event와 알림 우선순위를 결정하되, 하위 material 사건 태그는 event_output 규칙에 따라 전부 보존한다 (LEAK-9).
    예외: 신주 발행·조달이 IPO 거래의 기계적 구성요소이면 primary_event=ipo — 서열 1(희석)이 서열 3(IPO)의 라이프사이클 추적을 가리지 않는다'
