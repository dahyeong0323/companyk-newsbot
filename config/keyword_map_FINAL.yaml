      - 온톨로지에 없는 반복적 공학 용어 (기술 문맥 토큰과 공기)
      - 제조 준비성 언어 (양산·인증·라인 셋업 등 상태 전이 서술)
      - 외부 고객·파트너의 기술 검증 서술
      - 규제 기술 문서 인용 (기술 심사·인증 서류)
      effect: 플래그 기사는 심층 기술 판정 큐로 라우팅 — 본문 fetch + judge 정밀 판정. 자동으로 important가 되는 것이 아니라 '중요할 가능성이 있는 미지 기술'이 일반 company_update로 영구 침묵하는 것을 막는
