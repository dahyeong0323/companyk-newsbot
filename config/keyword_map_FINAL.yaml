schema_version: 4.6.1
name: companyk_news_event_map
language:
- ko
- en
purpose:
- portfolio_company_intelligence_collection
- material_event_detection
- news_priority_classification
- company_intelligence_feed_retention
design_philosophy_v4_2: 넓게 수집하고, 선별적으로 우선순위를 매긴다(broad collection, selective prioritization). '긴급하지 않음'은 '수집 가치 없음'이 아니다. 루틴한 회사 소식도 낮은 알림 우선순위로
  피드에 보존된다. 완전히 사라져도 되는 것은 오직 wrong-entity·중복·순수 주가 노이즈·스팸·무관 콘텐츠뿐이다
changelog_v4_6_1:
  basis: Step 6 portfolio-wide blind validation identified two knowledge-time evidence gaps and three incorrectly closed zero-exposure companies; no global architecture or precision failure was found.
  changes:
  - 'WAUG: replaced the unsupported 2023-07-12 date with a dated 2023-01-13 WAUG Japan-attraction sales page and re-evaluated knowledge-time controls.'
  - 'Geninus: advanced valid_from from 2022-12-13 to 2022-12-15, the first dated investor-research evidence explicitly identifying Geninus use of 10x Genomics Visium.'
  - 'Buzzvil: replaced the zero-exposure marker with one narrow Android/Google Play SDK-policy dependency exposure.'
  - 'MPN/Chrono24: replaced the zero-exposure marker with one narrow secondary luxury-watch marketplace demand/liquidity exposure.'
  - 'Studio&New: replaced the zero-exposure marker with one verified Disney+ Korean-content commissioning/customer exposure.'
  - Appended Step 7 targeted regressions; every v4.6.0 external regression remains an identical prefix.
  not_patched_by_design:
  - Route A, entity_match_required, taxonomy, global Route B matching/judge logic, thresholds, original 22 pilot exposures, unrelated Step 5.5 exposures, legacy 181 regressions, and existing external regression prefix.
  - Portfolio-wide final freeze or production-runtime performance claim.
changelog_v4_6_0:
  basis: Step 5.5 portfolio-wide exposure review of the 33 companies outside the v4.5.1 pilot, using 2022-01-01 through 2026-08-11 public evidence.
  changes:
  - Reviewed all 33 remaining company_rules and added only narrow, time-valid external exposures with explicit causal gates.
  - Added explicit no_justified_external_exposure markers where evidence did not support a defensible company-specific exposure.
  - Appended expansion-only targeted external regressions; the existing 50-case suite remains an identical prefix.
  - Added non-behavioral portfolio expansion coverage metadata and corrected the obsolete pilot-only known limitation.
  not_patched_by_design:
  - Route A, event taxonomy, global Route B matching/judge logic, thresholds, original 22 exposures, frozen 88 cases, legacy 181 regressions,
    and existing external 50 regressions.
  - Portfolio-wide logic freeze or production-runtime performance claim.
changelog_v4_5_1:
  basis: Step 2 historical stress test에서 52개 material positive 중 유일한 MISS가 RIDI comparable peer coverage로 확인됨. 카카오엔터테인먼트 1.2조원 투자유치는 material
    comparable transaction이지만 기존 exposure가 WEBTOON만 명시해 query/exposure gate에서 누락. 34개 negative 전부 정상 거부 및 신규 recurring root-cause 부재를 고려해 RIDI
    exposure만 surgical patch.
  changes:
  - 'RID-P1: ridi_webtoon_comparables에 Kakao Entertainment exact entity terms 추가 — Kakao Corp 일반어 또는 다른 Kakao 계열사로 확장 금지.'
  - 'RID-P2: peer-specific valid_from·공식 근거·유사성 차원(content format/platform model/IP model/market scope)을 additional_verified_peers에 명시.'
  - 'RID-P3: 2023-01-12 카카오엔터테인먼트 1.2조원 투자유치 positive와 non-transaction·parent/legal-entity mismatch negative 2건을 targeted regression으로 추가.'
  not_patched_by_design:
  - global comparable_transaction matching rule·judge prompt·event taxonomy 변경 금지.
  - Route A, 다른 company/exposure, notification/rollout phase 변경 금지.
  - KakaoPage·Kakao Webtoon·Piccoma·Tapas·Radish 등 서비스/계열사를 추가 peer alias로 자동 확장 금지.
changelog_v4_5_0:
  basis: 외부 영향 뉴스 historical reverse research — v4.4.5는 entity_match_required=true인 direct route의 정밀도는 높지만, 포트폴리오 회사명이 기사에 없고 외부 사건→회사 exposure
    연결이 필요한 뉴스는 구조적으로 누락됨. 2022~2026 공개자료로 13개사·10개 industry·35 strict benchmark candidate를 구성했고, 누락 패턴이 소수 exposure family로 near-saturation됨.
    기존 direct route는 무변경 보존하고 별도 shadow external-impact route만 추가.
  changes:
  - 'EXT-P0: external_impact_logic 신설 — Company entity 없이도 External Event → time-valid Exposure → Portfolio Company → Causal Impact 경로로 연결. 초기
    mode=shadow, notification=false.'
  - 'EXT-P1: company_rules 13개 파일럿 회사에 external_exposures 추가 — policy/regulation, demand, customer, competition, technology standard, scientific
    read-through, supply/input, platform dependency, comparable transaction.'
  - 'EXT-P2: knowledge_time_guard 신설 — 모든 exposure에 valid_from 요구. 사건일보다 미래에 알려진 관계를 historical match에 사용하는 hindsight leakage 금지.'
  - 'EXT-P3: broad-industry-only guard — AI/반도체/바이오/로봇/핀테크 등 일반 산업어 단독으로 회사 연결 금지. material event + company-specific exposure + causal mechanism을
    모두 요구.'
  - 'EXT-P4: external event dedup을 company attach보다 먼저 수행 — 동일 외부 사건을 회사별로 복제 저장하지 않고 event cluster 1개에 impact_links N개 연결.'
  - 'EXT-P5: external impact output을 direct event와 분리 — external_event=true, exposure_id, impact_direction, impact_mechanisms, impact_confidence,
    knowledge_time_valid 필수.'
  - 'EXT-P6: 35건 historical golden benchmark를 external_impact_regression_tests에 이식하고 synthetic negative controls 추가.'
  - 'EXT-P7: implementation_mapping에 external query registry, time guard, causal judge, shadow retention, regression/lint 요구사항 추가.'
  not_patched_by_design:
  - entity_match_required=false 전환 — 기존 direct entity precision을 훼손하므로 금지.
  - 46개 전 회사 external_exposure 일괄 생성 — 13개 파일럿으로 architecture 검증 후 확장.
  - broad industry keyword를 alias로 승격 — noise 폭증 위험으로 금지.
  - external route의 urgent/important notification — shadow calibration 전까지 비활성화.
changelog_v4_4_5:
  basis: 소스 토폴로지 반복 — 잔존 누수가 어휘가 아니라 '공식 공공 DB에 있는데 어떤 소스 계층도 보지 않는' 정보임이 확인됨. 모든 패치는 2024~2026 실제 공개 사건으로 검증 (Companies House 실조회 포함). 분류 문제/어휘
    문제/소스 문제를 구분해 소스 문제만 소스 계층에서 수리 — 무분별 키워드 추가 없음
  changes:
  - 'BT5-P0: jurisdictional_corporate_registry 신설 — 최강 실증: Infinitesima 2025-12 지배구조 변경 체인(SH01 신주배정→신주인수권배제 결의→이사 6인 해임→Maverick Silicon Fund
    L.P. PSC 등록 25~50%→신임 이사)이 보도자료·기사·뉴스룸 어디에도 없이 등기부에만 존재. 관할별 어댑터(GB 무료 실검증/DE 무료·미검증/SG 유료/US not_applicable 검증), 문서→기존 온톨로지 매핑(신주배정→dilution,
    PSC→control, 담보→부채 신호), effective_date 기준 기록(제출 지연 실측: 2년), legal_entity_graph(자회사 등기≠자동 포트폴리오 사건, Chrono24 UK PSC가 모회사 MPN GmbH 지배≥75%를 무료
    노출), source_inventory corporate_registry 슬롯 + 외국 회사 ready 규칙 (''구글·뉴스룸·영문 쿼리 작동 ≠ 완전 감시'')'
  - 'BT5-P1a: facility_project_public_records 신설 — 프로파일 주도(전 지자체 크롤 금지), 실측 구현 제약 명시: 지자체 고시·공고 게시판은 웹 검색에 색인되지 않음(회사명 질의 0건 실측), 건축 단계는 세움터 주소
    키 조회만 가능 → board-native 폴링 + 주소 키 조회로 구현. committed_milestone 양방향 연동: 공공기록 진행 확인 시 침묵 경고 억제, 무진행 시 overdue 유지'
  - 'BT5-P1b: government_award_result_collector 신설 — program_registry 필드 확장(운영기관· 부처·공식 결과 소스·결과 발표 창), 라이프사이클 상태(지원≠선정≠수령 — KDDF 4개월 간극 실측),
    차단 정부 포털의 의도적 질의'
  - 'BT5-INV: dual_route_invariant 공식화 — 뉴스 차단 ≠ 수집기 차단. 3회 반복된 패턴 (HR·기업DB·정부포털)의 불변식화 + 차단 도메인 추가 시 수집기 겹침 CI diff'
  - 'BT5-D: 일반 부채 파이낸싱 — ''테스트 후 최소 추가'' (전용 패밀리 기각). 실측: 독립 부채 조달 뉴스 이벤트 0건, 실재 사건은 감사보고서(구다이 FY2024 차입 +270억, 뉴스 0건)와 인수금융(기존 ma 어휘가 포착)에 존재.
    감사보고서 파서에 차입금 증분 추출(잔액 무알림, 증분 물질성 게이트), 등기 담보권 라우팅, 뉴스 협의 4어(벤처대출·venture debt· credit facility·term loan)만 추가. ''대출'' 단독 금지 — 뱅크샐러드가 대출비교
    사업자'
  - 'BT5-OPS: ops_ledger_v4_4_5 — 레거시 갭 전량 상태 판정(resolved 2 / superseded 1 / not_applicable 1 / still_open 8). still_open 필수 소스 보유 회사는 ready=false
    유지 + 브리핑 사유 표시'
  - 'ADD: 회귀 테스트 V445-1 ~ V445-9'
  not_patched_by_design:
  - debt_financing 전용 뉴스 패밀리 — 이벤트 볼륨 부족 + 대출 어휘 충돌로 기각 (증거 기반 기각, 위 BT5-D 최소 라우팅으로 대체)
  - 미국 소유권 등기 — 무료 공적 경로 부재가 '검증된 한계' (known_limitations 등재)
changelog_v4_4_4:
  basis: v4.4.3 스트레스 테스트 6종(적대적 정밀도 공격, 2023 unseen-period, 소스맹 검증, 6주 라이브 드라이런, irReference/감사보고서 일반화 검증) 반영. v4.4.3r 소비자 분할 구조(entities/classification/collection/tests/archive)
    위에 구축
  changes:
  - 'BT4-P1: bare ''취하'' 롤백 — 소송 취하(호재)가 urgent 임상 셋백으로 극성 반전되던 최악 오탐. 패턴 3종이 오름 사례를 전부 커버하므로 리콜 손실 0'
  - 'BT4-P2: partnership 가드 사본 재선언(제휴·본계약·실시권·총판·딜러십·판권) — 무가드 출고 6개 용어군 전원 충돌 실측. 가드는 형제 패밀리로 상속되지 않는다'
  - 'BT4-P3: ma.withdrawal 가드(무산·백지화·협상결렬)'
  - 'BT4-P4: 라운드/조달 가드 실질화 — ''원·억'' 제거(골프 가격·조달청 금액이 통과시키던 성능적 가드), negative_context(골프·조달청 계열) 추가'
  - 'BT4-P5: earnings passing_mention 확장 + fiscal_period_binding (다사 기획기사· 전년 실적 재발화 차단)'
  - 'BT4-P6: 노이즈 도메인 추가 — 커머스 리스팅(출시·신제품과 최악 충돌)·리테일 포럼'
  - 'BT4-P7: one_entity_per_query(다중 OR 붕괴 실측 0/4) + 연도 토큰 단독 결합 금지 (애그리게이터 하이재킹 6/6 재현)'
  - 'BT4-P8: fresh_window_rule — 신선 윈도우에서 event-qualified 성능 반전 실측(1/3), 일일 운영은 DART/KIND 폴링이 검색에 선행, 창 내 판정은 fetch 검증 필수(77% FP)'
  - 'BT4-C1: KIND irReference 필수→조건부(IR/PR 비율 트리거) + forward guidance 추출로 재정의 + POST/OpenAPI/IRGO 구현 제약 명시(GET 폴링은 조용히 실패) — 1개사(지투지) 과일반화 철회,
    상장 5사 검증 결과 반영'
  - 'BT4-C2: earnings 실측 재보정 — 영업손실 헤드라인 0회 → body_layer로 격하, 융합형→근접 패턴, 사상최대·손실폭·적자기업 추가, 감사보고서 검색 키를 문서명이 아닌 출처 표지(금융감독원·전자공시)로 이동, 시즌 창 재설정(3/15~4/15
    + 2월), 우선 경로를 뉴스 폴링에서 집계 DB로 변경(8/8 실측)'
  - 'BT4-N1: listed_status_risk 패밀리 — KRX 지정사유 체계에서 ''연역'' 도출(관리종목· 상장폐지·실질심사·거래정지·계속사업손실 등, 지정=urgent/해제=urgent-positive 양방향). 2023 테스트가 발견한
    패밀리 전면 부재(grep 0회) 해소'
  - 'BT4-N2: CB 채권자측 이벤트(풋옵션·콜옵션·차환·만기연장·기한이익상실) + direction 값 liquidity_drain 신설 — 기존 4값이 표현 못 하던 주식수 불변·현금 유출'
  - 'BT4-N3: 기술성평가 ''탈락'' — lifecycle-failure 비대칭 4번째 실측 사례 해소'
  - 'BT4-N4: ipo.offering_structure(풋백옵션·시장조성·초과배정) — 공모 ''조건'' 신호'
  - 'BT4-N5: facility ''건립·기공·부지확보'' — 주석-어휘 desync 실물 사례 해소, committed_milestone 트리거 반쪽 상태 수리'
  - 'BT4-N6: corporate_data_collector 신설(스타트업DB·업계 전문지 1급 소스화) + headcount_delta가 채용공고 수를 대체 — ''조용한'' 8개사 전수 소스맹 실측의 귀결 (로토토베베 경영권 매각, 메디노 -42%
    등이 전부 이 계층에만 존재)'
  - 'BT4-N7: AI ''리더보드'' 계열 (2023 실측 지배 명사)'
  - 'BT4-N8: financing SI투자·전략적투자 — counterparty_field 규칙의 입력 어휘 공백 해소'
  - 'BT4-N9: silence 3계층 게이트(뉴스+DB+업계지 독립 무신호 시에만 증가)'
  - 'BT4-N10: site_staleness — 동결 사이트(아이랩 2021~)가 침묵을 확증하던 역설 수정'
  - 'BT4-N11: announcement_reality_cross_check — 발표와 실체 신호의 모순 플래그(메디노 패턴)'
  - 'BT4-S1: matching_semantics(entities) — token_boundary 필수·문맥 윈도우 ±15토큰· 인접 패턴·인명 가드. 6개 용어군 충돌의 공통 원인(부분문자열+문서 공기)을 매처에서 수리'
  - 'BT4-S2: schema_lints 3종 — lifecycle_completeness(실패 상태 강제)· cross_family_guard_consistency(가드 비상속 명시)·comment_vocab_desync. 동일 결함 5회 재발의
    결론: 케이스 패치가 아니라 불변식'
  - 'ADD: 회귀 테스트 V444-1 ~ V444-14'
changelog_v4_4_3:
  basis: 3년 히스토리컬 백테스트(2024·2025·2026, 46개사, ~250회 실검색 + ~60회 날짜 검증 fetch)에서 '측정된 재발 빈도' 순으로 정렬한 패치. 아키텍처 불변
  method_note: v4.4.2까지의 패치는 단발 사례 기반이었다. v4.4.3은 2024 백테스트가 제기한 8개 가설을 2025~26 데이터로 재측정해 recurring / one-off를 분리한 뒤 반영한다 — 재발한 것만 우선 처리
  changes:
  - 'BT3-1 (재발: 3년 연속, 최다빈도): earnings 어휘에 영업손실·순손실 및 헤드라인 지배형 복합어(적자지속·적자폭·만년적자·손실확대/개선·역대최고) 추가. v4.4.2에 ''영업손실''은 0회였고 en에는 operating loss가
    있어 KO/EN 비대칭이었다. 실측 리디(2025-04, 2026-04)· 와드(2026-05)·오름(2026-03 영업손실 517억)·뱅크샐러드(2025-04)·브이씨(2024-11). + audited_report 서브패밀리 신설(감사보고서·감사의견·계속기업불확실성)과
    3~4월 시즌 폴링'
  - 'BT3-2 (2026 최고가치 발견): KIND irReference(IR Book PDF)를 상장사 direct_poll 1급 소스로 승격 + monitoring_ready 필수 소스 편입. 2026년 지투지바이오 최상위 사건 3건 (삼성바이오에피스
    기술이전 3-16, GB-5021 비임상, 제2 GMP 착공 계획)이 전부 이 경로에만 존재하고 국내 뉴스 0건이었다. 아울러 ''결정적 수집 계층이 2024 뉴스 → 2026 공시·IR로 이동''하는 추세를 반영해 official_company_sections에
    감사보고서 탐색을 명시'
  - 'BT3-3 (재발: 2024→2026): ma 라이프사이클 어휘 완성(우선협상대상자·우협·본계약·SPA· 거래종결·인수금융) + withdrawal 서브패밀리 신설(인수철회·무산·백지화·협상결렬). ipo에는 있던 withdrawal이 ma에는
    없던 비대칭 해소. ''본계약''이 partnership에만 있어 M&A 체결이 서열 4→8로 강등될 경로도 차단. ma를 ontology_sync_contract scope에 편입'
  - 'BT3-4 (신규 지배적 위험군): judge_rules.polarity_guards 신설 — 어휘 확장으로 고칠 수 없는 4대 오독 패턴. (a) denial_framing: ''무산 아냐/철회 아냐'' 부인 보도를 확정 결렬로 오독 금지(실측
    라포랩스·지투지 2건 모두 부인이 선행), (b) distressed_party_direction: 회생·법정관리 어휘가 덮인 기사에서 포트폴리오사가 인수자면 ma(긍정) 유지 — 실측 오아시스마켓의 티몬 스토킹호스 인수(2025-06), (c)
    euphemism_expansion: 회사의 완곡어 매칭(Chrono24가 25% 감원을 ''streamlines organizational structure''로 발표), (d) sentiment_object_separation: 부정 프레이밍이
    사건 극성을 결정하지 않음 (''만년 적자 A사에 5,600억 베팅''의 사건은 긍정)'
  - 'BT3-5 (재발: 플랫폼/CDMO형 구조적): bio_drug.deal에 개발계약·연구계약·제형개발· 실시권·상업화권리·옵션계약 추가 — 실측 지투지-베링거 2건(2025-02·07)이 기술이전 계열 어휘를 하나도 포함하지 않아 일반 partnership(normal)로
    강등될 경로였다. + bio_drug.negative에 자진중단·자진취하·취하·IND취하 및 띄어쓰기 방어 패턴 추가 — 실측 오름 ORM-5029(2025-04-28), 포트폴리오 2025년 최악의 임상 사건이 어휘 밖이었다. + partnership_contract.contract_termination
    신설(올릭스-떼아 기술이전 계약 해지)'
  - 'BT3-6 (재발: 2024→2025): partnership_contract 공통 패밀리에 제휴·전략적제휴·업무협약 추가(기존엔 핀테크·커머스 industry 목록에만 존재) + 유통계약 계열(총판·딜러십· 독점딜러십·판권·실시권). 실측 겟차-현대글로비스(2024-09)·캐치테이블-GMO(2025-01)·
    바로팜-브랜드501·이마고웍스 독점딜러십(2025-03)'
  - 'BT3-7: commercialization.ko에 출시·신제품·론칭 추가 — en에는 launch가 있는데 ko는 B2B 어휘 일색이라 소비재사의 제품 출시가 company_update로 강등됐다(브이씨 T12 PRO 2025-03-04). pr_gate는
    그대로 적용되므로 근거 없는 출시 PR은 여전히 normal'
  - 'BT3-8 (오탐 실측 악화): 올릭스 영문 충돌 강화 — 2026년 영문 ''Olix funding'' 쿼리가 10/10 영국 AI칩 스타트업을 반환하고 한국 파마는 0/10이었다(2025년엔 오염 0). english_blocked_domains(olix.com
    등) + required 문맥 확장(GalNAc·OLX702A·226950) + known_negative_entities에 영국 Olix를 1회 등록해 재판정 없이 억제'
  - 'BT3-9 (재발·매년 변형): government_grant_project에 program_registry 신설 — 정부사업 고유명사는 연 단위로 이름이 바뀐다(2024 DIPS·캔서문샷·KPAS → 2025 독자 AI 파운데이션 모델·바이오산업기술개발사업
    → 2026 국민성장펀드). 일회성 사전이 아니라 갱신 주기를 가진 유지보수 목록으로 관리 + 선정 동사(선정·발탁·주관기관선정) 추가'
  - 'BT3-10: event_output에 multi_event_extraction·same_transaction_two_faces 규칙 명시 — ''기사 1건 = 사건 1건'' 가정이 정보를 삭제한다. 실측 일리미스 시리즈B 보도자료(2025-07-14)
    본문에 매립된 일라이릴리 GAIA 협력, 지투지 200억 CB와 삼성바이오에피스 기술이전의 동일 딜 양면. + financing.counterparty_field 필수화(전략적 투자자는 파트너십 병발 후보)'
  - 'BT3-11 (신규 사각): accumulation_rules.committed_milestone_tracking 신설 — 회사가 공표한 기한 있는 마일스톤을 due_date와 함께 기록하고, 경과 후 후속 사건이 없으면 milestone_overdue로
    검토 큐에 올린다. 실측 엑시나 2024-12 PR의 ''첫 ASIC 2025 상반기''·''미국 브릿지 조달'' 둘 다 미발생·무보도(18개월 침묵), 피지티 군산 공장 ''2024-06 준공 목표'' 후속 0건. 지연을 보도하는 기사가 없으므로
    셋백 어휘로는 원리상 포착 불가 — silence_monitoring은 침묵을 알지만 무엇이 약속됐는지 모른다'
  - 'BT3-12: english_monitoring.null_result_disambiguation 신설 — 영문 층에서 ''뉴스 없음''과 ''뉴스가 한국어에만 있음''이 동일 결과집합(기업DB 프로필 페이지)을 만든다. 기업DB 도메인으로만 채워진
    결과를 null이 아니라 ko_check_required 상태로 승격. 실측 PortOne·큐픽스·메이크스타 2025~26'
  - 'BT3-13 (저빈도·저비용): strategic_change에 철수 계열(사업/시장/채널 철수·서비스종료)과 합병 표현 변형(통합법인·출범·재탄생) 추가; ipo.generic에 테슬라요건·이익미실현특례 등 코스닥 실존 트랙명 + pricing_tone(밴드하회·수요예측부진)
    신설; blocked_domains_global에 기업DB(thevc·innoforest·Tracxn·PitchBook 등)·정부공고 포털(nipa·bizinfo) 추가 — 저신호 기업 쿼리에서 검색 예산 20~40%를 잠식하던 노이즈'
  - 'ADD: 회귀 테스트 V443-1 ~ V443-12'
  not_patched_by_design:
  - 철수·출자전환·rename/merger는 2025~26 재측정에서 재발 0건 — one-off로 판정. 철수는 저비용이라 어휘만 추가(BT3-13), 나머지는 기존 처리 유지
  - recall 수치는 여전히 주장하지 않는다 — 독립 구축 골드셋이 없기 때문
changelog_v4_4_2:
  basis: 2차 히스토리컬 스트레스 테스트(46개사, 2025-08~2026-08)에서 발견된 실제 leakage 7건의 반영 — 아키텍처 불변, v4.4.1 작동 영역 보존
  changes:
  - 'BT2-1 (P0): financing 검색-분류 온톨로지 동기화 — 라이온로보틱스 ''최소 1,500억 라운드'' (2026-06) 사례: ''라운드'' 단독 표기 기사를 검색·분류 어휘 모두 미보유. 분류기에 라운드·투자라운드·조달·브릿지·클로징·투자완료
    추가(문맥 가드 동반 — 골프 라운드·정부조달 충돌 방어), 검색 템플릿 KO/EN 동기 확장, financing을 ontology_sync_contract scope에 편입 + exclusions 등재'
  - 'BT2-2 (P0): 출자전환(debt-to-equity) 신설 — 이뮤노포지 2025-09-18 출자전환 공고 (RCPS 제3자배정) 사례: ''신주발행'' 2차 어휘 의존은 불안전. debt_equity_conversion 서브패밀리 신설,
    이중 경제효과(신주·희석 + 채무 감소) 병기 서술 의무 — 희석만으로 순부정 서술 금지'
  - 'BT2-3 (P0): 공식 도메인 소스 발견을 ''뉴스룸/블로그'' 너머로 확장 — Blumn AI 경영공시 페이지(RCPS ~50억 제3자배정), 이뮤노포지 NOTICE 페이지 사례: official_company_sections 발견 규칙 신설
    (notice·공고·경영공시·IR·주주공고 등), 섹션별 워터마크. 검색엔진 색인은 백스톱이지 1차 보장이 아님'
  - 'BT2-4 (P0): monitoring_ready 운영 준비 게이트 신설 — ''스키마가 DART 폴링을 요구한다''와 ''corp_code가 실제 설정되어 폴러가 돈다''의 구분. 필수 소스가 expected_but_unconfigured·미해결·unhealthy인
    회사는 monitoring_ready 금지, 일일 브리핑에 비준비 회사·사유 명시(커버리지 면책 표시)'
  - 'BT2-5 (P1): 제3자 공시 전문 검색 백스톱 — 스튜디오앤뉴 제작 계약이 ''상대방''의 공시로 공개된 사례: DART/KIND 전체 공시 코퍼스에서 포트폴리오 사명·확정 alias를 제출자 무관 검색, 후보 이벤트 파이프라인 투입 (상대방
    공시는 해석의 전권 없음 — judge 검증)'
  - 'BT2-6 (P1): alias 상태 불일치 수정 — alias_feedback.requires가 미선언 상태 ''verified_entity''를 참조하던 구현 버그. 정식 상태 confirmed_entity로 정정 — 오늘 해소된 영문 alias(WIRobotics
    등)가 내일 검색을 실제로 개선하도록'
  - 'BT2-7 (P1): HR 노이즈 차단과 workforce 신호 수집의 분리 — blocked_domains_global의 적용 범위를 ''뉴스 검색 파이프라인''으로 한정, workforce weak-signal collector는 승인된 채용
    포털을 ''의도적으로'' 질의. 전역 차단이 전용 수집기를 비활성화하지 못함'
  - 'BT2-8: 이벤트 라이프사이클 단계 명시 (candidate→discussion→planned→filed→approved→ signed→completed→commercialized) + 선행 단계에서 후행 단계 추론 금지 규칙 — ''체결 논의''를
    ''체결 완료''로 승격 서술하는 오류 차단. 미체결 BD 논의는 intelligence로 보존하되 허위 업그레이드 금지'
  - 'ADD: 회귀 테스트 V442-1 ~ V442-7'
changelog_v4_4_1:
  basis: 2025-08~2026-08 1년 실데이터 백테스트(46개사, ~125회 실검색)에서 발견된 7개 결함의 외과적 패치 — 아키텍처 변경 없음
  changes:
  - 'LIVE-1: blocked_domains_global 신설 — 채용포털(사람인·잡코리아·잡플래닛·캐치·원티드)과 시세·주주토론 포털(알파스퀘어·씽크풀·38커뮤니케이션·stockplus)이 KO entity 검색 결과의 30~50%를 점유하던 노이즈
    플로어 제거 (검색 결과 후처리 필터)'
  - 'LIVE-2: 올릭스 영문 충돌 방어 — 2026-08 영국 AI칩 스타트업 ''Olix''($3.3B 밸류에이션, $312M 라운드)가 영문 financing 쿼리를 점령. english_negative_context + english_required_context
    신설 (첫 실전 english_negative_context 적용 사례)'
  - 'LIVE-3: 실측 entity 충돌 3건 코드화 — 라이온로보틱스↔라온로보틱스(232680)· 레인보우로보틱스, 블룸에이아이↔bloom-ai.me(캐릭터 챗 앱), PortOne↔''Port One'' 물류'
  - 'LIVE-4: silence_monitoring 신설 — 프로그린테크(공장 건립·IPO 이력 후 12개월+ 무보도) 사례: ''기대 신호 기업의 침묵''은 소스 장애도 회사 무사도 아닌 리스크 신호. accumulation_rules에 편입, 공시
    직접 조회 트리거'
  - 'LIVE-5: financing.valuation_signal 신설 — PortOne 다운라운드 사례: 조달 사실만이 아니라 밸류에이션 방향(down_round)이 테제 관련 신호. down_round는 urgent + negative 플래그'
  - 'LIVE-6: 날짜 해소 사다리(date resolution ladder) 신설 — 스니펫 무날짜·본문 fetch 차단으로 백테스트 발견 15건이 날짜 미검증. urgent 알림은 날짜 검증 또는 date_approx 플래그 필수'
  - 'LIVE-7: ops_actions_v4_4_1 — 상장 6사 DART corp_code 즉시 설정(브이씨 공백은 현재 진행형 leak), zymedi.com 뉴스룸 등록(검색 커버리지 0 실측), 이마고웍스 CE/캐나다 인증일 원문 검증'
  - 'ADD: 회귀 테스트 V441-1 ~ V441-6'
changelog_v4_4:
- 'P0-1: entity_resolution 신설 — 영문 폴백 식별자와 entity gate의 모순 해소. v4.3에서는 ''음역은 entity 매치 근거로 단독 인정 안 함'' 규칙이 폴백 검색으로 찾은 기사(Makestar 등)를 gate에서 즉시
  기각시켜 정보가 그대로 소멸(검색 성공→기각→소멸). 이제 provisional_entity_candidate 상태가 기사 회수·본문 fetch·검증 라우팅을 허용하되 confirmed 취급은 금지. 강한 신호(공식 웹사이트/뉴스룸·공시·특허 출원인·임상
  스폰서· 제품명·파이프라인·경영진·자회사·주소·사업 서술·복수 독립 속성)로 검증 후 확정, 검증된 표기는 alias_feedback으로 english_aliases 등록 제안. entity gate 자체는 무변경'
- 'P0-2: technology_recall_family_mapping 신설 — industry 키(bio_drug·battery)와 recall family 키(bio_preclinical·battery_materials)의 불일치가 기술 백스톱을
  통째로 비활성화할 수 있던 구현 모호성 제거. 결정적 매핑 + 복수 industry는 합집합 (중복 쿼리 실행 금지) + ''모든 industry는 최소 1개 패밀리로 해석돼야 함'' CI 테스트'
- 'P0-3: general_technology recall family 신설 — 전 포트폴리오 공통 실행. 핀테크 결제 아키텍처·헬스케어 영상 정확도·커머스 물류 자동화 등 5대 특화 산업 밖 기술 마일스톤/셋백의 검색 백스톱 부재 해소. 특화 산업은
  특화 패밀리를 ''추가로'' 실행'
- 'P0-4: english_auto_enable 운영 로직 완전 제거 — implementation_mapping·company_rules 주석·source_priority 노트의 잔존 참조를 english_monitoring(baseline: always_on,
  enhanced: metadata_driven)으로 교체. changelog 언급은 historical로만 유지 (deprecated_terms 섹션 참조). ''온보딩 메타데이터로 영문 모니터링 on/off 평가'' 구현 금지'
- 'P0-5: capital_structure_recall_query_families 신설 + capital_structure ontology_sync_contract — 희석 분류기는 20+ 사건을 알지만 검색 백스톱은 6개 어휘였음. 신주발행·전환증권·전환/리픽싱·주식보상·오버행·발행능력·희석감소
  7개 컴팩트 패밀리 (KO/EN)로 분류-검색 동기화. 비상장사(DART 부재)에서 특히 치명적이던 격차 해소'
- 'P1-1: baseline vs enhanced 영문 쿼리 의미 확정 — 고우선 영문 event-qualified 백스톱은 baseline에 포함(전 회사, 낮은 주기 허용). enhanced는 주기·소스 깊이만 바꾸며 쿼리 패밀리의 존재 여부를 결정하지
  않는다 (불변식 명문화)'
- 'P1-2: source_inventory + source_coverage_health 신설 — ''설정된 적 없는 소스는 실패한 적도 없다'' 누락 클래스 해소. 회사 유형·산업별 기대 소스 정의, configured / not_found / not_applicable
  / broken / expected_but_unconfigured 상태 구분, 미설정 기대 소스 경고 + 주기적 재탐색'
- 'P1-3: 운영적 ''ignore'' 잔존 제거 — certainty_ladder.speculation_only 등을 notification/retention/flags 명시 필드로 교체. ignore는 어떤 활성 규칙에서도 결정 상태가 아님. 레거시
  테스트의 expected_priority: ignore를 명시 기대값으로 번역'
- 'P1-4: ontology_sync 예외 목록을 실행 가능 구조로 — 실제 exclusions 엔트리 ({term, family, reason}) + 정규화·커버리지 판정 규칙(대소문자·하이픈·공백·복수형· 부분문자열·구 단위) 명시. ''바이오마커''가
  ''바이오마커검증''을 커버하는지 등 결정적 CI 판정 가능. technology와 capital_structure 양쪽에 적용'
- 'P1-5: partner_graph 첫 발표 독립성 명문화 — 첫 기사는 파트너 등록 여부와 무관하게 baseline entity 발견으로 잡혀야 하며, 그래프는 ''이후'' recall만 개선한다. E3 회귀를 전체 시퀀스(회수→검증→분류→보존→candidate
  제안)로 강화'
- 'P2: v4.3 보호장치 전부 무변경 (catchall·detected/material·retention 분리· IPO 단계·희석 방향·다중 사건·거래 dedup·셋백·PR 게이트·워터마크·백필· technical_review·accumulation·entity
  정밀도 일체)'
- 'ADD: deprecated_terms 섹션, 회귀 테스트 E4·E5, TECH8~TECH11, DIL1~DIL4, EN6, SRC1·SRC2, IGN1·IGN2. T016/T032/T040/T049 ignore 의미 명시 번역'
changelog_v4_3:
- 'P0-1: 영문 모니터링을 전 포트폴리오 baseline으로 전환 — 구조화 필드는 활성화 여부가 아니라 ''깊이(enhanced 소스·빈도)''만 결정. 온보딩 메타데이터 미기입이 영문 발견을 완전히 차단하던 의존성 제거. 영문명 부재 회사를 위한
  entity 발견 폴백 (라틴 법인 표기·번역/음역 변형·제품명·도메인 메타데이터) + 정밀도 가드 추가'
- 'P0-2: 기술 검색 비대칭 해소 — technology_recall_query_families 신설. 산업×단계×방향(positive/setback)별 컴팩트 쿼리 패밀리를 기술 온톨로지 (technology_milestone/technology_setback
  어휘)에서 ''생성·동기화''한다. 분류기가 아는 용어가 검색층에 없으면 명시적 사유 없이 통과 불가 (sync 계약)'
- 'P0-3: 탐지와 중요도의 구조적 분리 — detected_event_types(우선순위 무관, 긍정 분류 전부) vs material_event_types(important+). normal급 특허 출원·소액 옵션 부여도 카테고리 메타데이터가 보존되어
  ''이 회사 IP 이력 전부'' 류 조회가 가능. 알림 임계치가 분류 메타데이터를 파괴하는 경로 차단. 구 event_types는 material_event_types의 별칭'
- 'P0-4: lossless_collection 계약 신설 — 소스별 워터마크, 성공 처리 후에만 워터마크 전진, 중첩 수집 윈도우, 워터마크 도달까지 페이지네이션, 실패 재시도, 장애 후 백필, 발행시각 vs 수집시각 구분, 지연 인덱싱 대응, 소스
  헬스 모니터링. 불변식: 일시적 소스 장애는 ''지연 수집''이지 ''영구 손실''이 아니다. latest-N 의존 금지'
- 'P1-1: partner_graph 신설 — 수동 partner_watch 의존 완화. 미등록 상대방이 공급·채택·qualification·라이선스 문맥에서 반복 공기하면 candidate_partner로 제안, 공식 소스 확인 시 verified
  승격. 단일 모호 기사로 자동 등록 금지. 상태: candidate/verified/historical/inactive'
- 'P1-2: 영문 event-qualified 쿼리 명시 — IPO·희석·파이낸싱·상업화·네거티브 패밀리의 영문 등가 쿼리를 스키마에 명문화. ''분류기 영문 어휘 보유 ≠ 영문 검색 커버리지'' 가정 제거, 전 패밀리에 sync 계약 적용'
- 'P1-3: technical_review_candidate 플래그 신설 — 온톨로지 미포함 신기술 용어 보호. 큰 수치 변화·신규 식별자·미등록 공학 용어·제조준비 언어·외부 기술검증·벤치마크 표 신호 감지 시 심층 기술 판정 큐로 라우팅 (자동 important
  승격 아님). 반복 등장 미등록 용어는 온톨로지 갱신 제안으로 피드백'
- 'P1-4: accumulation_rules 확장 — 반복 장애/고객 불만, 동일 신규 아키텍처 반복 언급, 미등록 고객사 반복 언급(partner_graph 연동), 릴리스 케이던스 하락, 신기술 영역 특허 출원 클러스터. 승격 후에도 원 단건 기록
  삭제 금지 명문화'
- 'P2: 정밀도 보호장치 전부 무변경 유지 (preserved_protections 11종 + v4.1/4.2 가드). 영문 baseline 확대에 따른 음역 오탐은 entity 검증 단계 강화로 통제'
- 'ADD: known_limitations 섹션 신설 (잔존 누락 가능 경로 명시 — 무누락 주장 금지). 회귀 테스트 E1~E3, TTECH1~TTECH7, D1~D3, L1~L4 추가. T041/T055/T086에 detected/material
  분리 반영'
changelog_v4_2:
- 'ARCH-1: 수집 게이트 전환 — ''ENTITY_MATCH AND EVENT_MATCH'' 생존 규칙 폐지. entity가 성립하면 이벤트 사전 미매치 기사도 company_update로 수집·보존한다. 이벤트 사전은 분류·우선순위 결정용이지 생존
  결정용이 아니다 (v4.1까지는 CEO 인터뷰· 뉴스룸 포스트·경영진 발언·업계 심층 보도가 이벤트 어휘 미매치로 무조건 소멸)'
- 'ARCH-2: 5계층 파이프라인 명시 — collection / classification / materiality / notification_priority / retention을 분리. 각 계층의 판정이 다른 계층을 오염시키지 않음'
- 'ARCH-3: ''ignore'' 해체 — notification 없음(none)과 완전 폐기(discard)를 분리. 근거 없는 관측(M&A·IPO chatter)·반복 PR은 discard가 아니라 retain(플래그/접힘) — v4.1에서는 unsupported_speculation이
  ignore로 완전 소멸해 시장 chatter 정보가 손실됨'
- 'ARCH-4: 이벤트 패밀리 11종 신설 — management_change(임원 선임·사임), workforce_change(감원·희망퇴직·대규모 채용), customer_or_contract_loss(계약해지· 수주취소 — commercialization의
  대칭), corporate_structure(물적분할·자회사·지주사), governance(감사의견 거절·이사회·주총), pricing_monetization(수수료 개편·유료화), security_incident_or_outage(유출·장애), regulatory_sanction(과징금·제재
  — 전 산업), facility_expansion(착공·증설 — battery 전용에서 일반화), geographic_expansion(해외법인), government_grant_project(국책과제 — bio 전용에서 일반화)'
- 'ARCH-5: company_update 캐치올 패밀리 신설 — 이벤트 미매치 기사의 분류 수용처. notification 없음, 피드 보존. passing_mention(리스트 기사 스치는 언급)은 retain_collapsed'
- 'ARCH-6: intellectual_property에 특허 ''출원'' 추가 (등록만 잡고 출원 흐름을 버리던 비대칭 제거)'
- 'ARCH-7: partner_watch — counterparty_watch를 M&A 상대방에서 주요 고객사·파트너로 확장, 상대방(특히 해외 파트너) 뉴스룸·와이어 발표를 수집 경로에 추가. competitor_watch(선택, 피드 전용) 신설'
- 'ARCH-8: source_collection 확장 — 전 포트폴리오 회사 뉴스룸/블로그 RSS 보편 폴링, AI/반도체 기술 소스(GitHub releases·arXiv·Hugging Face·학회 프로시딩) 선택 폴링, 채용공고 추이(선택 신호)'
- 'ARCH-9: accumulation_rules 신설 — 단건 normal 정보의 누적 승격 (임원 연쇄 이탈, 반복 지연 언급, 반복 chatter, 연쇄 가격 조정) + 회사별 주간 다이제스트'
- 'ARCH-10: retention_policy 신설 — retain / retain_collapsed / discard 명시, discard 허용 사유를 5가지로 한정'
- 'ADD: 회귀 테스트 T070~T092. 기존 T016/T032/T040/T048/T057/T064의 retention 의미 명시 수정'
- 'PRESERVE: entity 정밀도 보호장치 전부 무변경 — 캐치올은 이벤트 게이트만 폐지하며 entity gate(forbidden_standalone·negative_terms·required_context)를 일절 우회하지 않음'
changelog_v4_1:
- 'LEAK-9: 다중 사건 보존 — 최상위 사건은 알림 우선순위(primary_event)만 결정하고, 나머지 material 사건 태그는 event_types에 전부 보존 (IPO 대시보드 등 downstream 라우팅은 event_types 전체
  기준). IPO 거래에 기계적으로 수반되는 신주발행·조달은 primary_event=ipo'
- 'LEAK-10: 기술특례 상장 준비 단계(기술성평가 신청/통과, 전문평가기관, A·A 등급) 추가 — IPO 문맥(상장·기술특례·코스닥·예비심사·IPO) 공기 필수, 일반 기술평가 기사 차단'
- 'LEAK-11: IPO 단계별 우선순위 세분화 — 목표/계획/검토/주관사선정/기술성평가=important, 예심청구 이후 확정 절차=urgent. 근거 없는 매체 관측은 ''IPO'' 단어만으로 승격 금지'
- 'LEAK-12: 따상·따따상을 IPO 이벤트 어휘에서 제거 → downgrade marker로 이동. 기저 사건은 신규상장으로 판정 (미보고 상태면 신규상장으로 catch)'
- 'LEAK-13: 유증 약어 추가 — 신주·발행·조달·억·원·제3자배정·주주배정 공기 필수 (遺贈 상속 충돌 방어)'
- 'LEAK-14: 의무보유등록 해제/의무보유기간 종료/보호예수기간 종료 등 오버행 어휘 확장 + materiality 판정 요인(수량·비율·보유자·매각 개연성) 명시'
- 'LEAK-15: 스톡옵션·RSU ''부여''(행사 전 미래 희석) 추가 — 완전희석주식수 대비 비율로 materiality'
- 'LEAK-16: authorized_capital_or_issuance_capacity 신설 — 발행가능주식총수·수권주식수· CB/BW 발행한도 확대 등 잠재 발행능력 증가 이벤트'
- 'LEAK-17: capital_structure_direction 신설 — 모든 자본구조 사건에 희석 증가/위험 증가/ 감소/중립 방향성 필수 출력. CB 소각을 ''urgent dilution''으로 서술하면 회귀 실패'
- 'LEAK-18: technology_setback 패밀리 신설 — 지연·실패·중단·미달 (산업별 포함, 범용어 문맥 가드로 배송지연·행사연기 차단)'
- 'LEAK-19: pr_gate 신설 — routine_pr_exclusions가 광의 산업 어휘(공개·발표·선봬·CES· 혁신상·확대·강화·1위 등)의 우선순위 승격보다 우선. 독립적 material 근거 없으면 normal'
- 'LEAK-20: source_collection 신설 — DART/KIND/뉴스룸/임상레지스트리/특허DB 직접 폴링 명시. 검색엔진 수집은 보조 수단이며 유일한 수집 경로가 아님'
- 'LEAK-21: english_auto_enable 조건을 회사 레코드에 실존하는 구조화 필드로 한정 — 구현 계약과 스키마 일치 (company_record_schema 신설)'
- 'LEAK-22: event_qualified_queries 신설 — 고뉴스볼륨 회사의 recall 백스톱. entity 검색을 대체하지 않고 병행'
- 'LEAK-23: dedup에 transaction_identity 추가 — 동일자·동일 subtype의 별건 거래 (오전 200억 CB / 오후 별건 300억 CB) 병합 차단. 한국 공시는 DART 접수번호 최우선'
- 'ADD: 회귀 테스트 T041~T067 (다중 사건 보존·기술성평가·따상·유증·의무보유·옵션 부여· 수권주식·소각·기술 셋백·PR 컨트롤·거래 단위 dedup)'
- 'PRESERVE: v4.0의 entity 정밀도 보호장치(엄격 entity 매치, forbidden_standalone, negative-term 부분문자열 규칙, context_terms 비자격, stock-move 하향, 근거 없는 관측 하향,
  루틴 PR 필터, 영문 entity 정규화, 다의어 문맥 공기, 소스 품질 우선, state-transition materiality)는 전부 무변경 유지'
core_logic:
  entity_match_required: true
  rule: ENTITY_MATCH required — EVENT_MATCH는 분류·우선순위 결정용 (ARCH-1)
  collection_rule: entity gate를 통과한 기사는 이벤트 사전 매치 여부와 무관하게 수집·보존한다. 이벤트 패밀리에 매치되지 않으면 company_update로 분류 (notification 없음, 피드 보존). 완전 폐기(discard)는
    pipeline.discard_only_if의 5가지 사유만 허용된다
  entity_sources:
  - legal_name
  - alias
  - product_name
  - pipeline_code
  - former_name
  - official_english_name
  field_semantics:
    aliases: 단독으로 그 회사임을 특정하는 문자열만 허용 (제품명·파이프라인 코드명·구명·영문명). 일반명사·기술용어·산업용어 금지
    context_terms: entity 매치 자격 없음. 이미 entity가 매치된 기사에서 관련성 확신도를 높이거나(judge), 같은 회사 기사끼리 사건 클러스터링할 때만 사용
    required_context: forbidden_standalone 이름이 이 단어들과 공존할 때만 entity로 인정
    negative_terms: '판정 규칙: entity 매치가 negative term의 부분문자열로만 성립한 경우에만 기각한다. entity가 독립 토큰으로 존재하면 negative term이 같은 기사에 공존해도 통과시킨다'
    counterparty_watch: 이 회사의 M&A/투자 상대방. 상대방 이름이 entity처럼 매치되면 해당 기사를 이 회사의 사건 후보로 승격해 judge에 전달
    partner_watch: 'ARCH-7: counterparty_watch의 확장 — 주요 고객사·파트너·라이선스 상대방. 상대방이 딜·계약·해지를 먼저 발표하는 경우(특히 해외 파트너의 영문 와이어)를 수집하기 위한 필드. 매치 시 이 회사의
      사건 후보로 승격. 기존 counterparty_watch 값은 partner_watch로도 해석된다'
    competitor_watch: 선택 필드 — 주요 경쟁사. 매치 기사는 이 회사의 피드에 competitive_development로 '피드 전용' 보존 (notification 금지, entity 매치로 인정하지 않음 — 회사 사건이 아니라 맥락
      정보)
    english_negative_context: 'LIVE-2/3: 영문 기사에서 이 토큰들이 공기하고 required 영문 문맥이 없으면 해당 영문 entity 매치를 provisional로 강등 후 검증(대개 rejected_entity). negative_terms의
      영문 문맥판 — 동명 외국 기업(Olix UK칩, Port One 물류) 충돌 방어 전용. 한국어 매치에는 적용되지 않음'
    context_required_events: 이벤트 단어 자체가 다의어인 경우(수요예측·청약·심사·유증·소각 등), 지정된 문맥 토큰과 공기할 때만 event 매치로 인정
  text_fields:
  - title
  - snippet
  - body
  normalization:
    ignore_whitespace_ko: true
    case_insensitive_en: true
    normalize_hyphen: true
    normalize_slash: true
  phrase_matching:
    exact_phrase_required: false
    prefer_token_and_patterns: true
    matching_semantics:
      token_boundary_required: guard(context_required_events)가 걸린 용어는 부분문자열 매치 금지 — 토큰 경계에서만 성립. '제휴카드/제휴할인/제휴사'는 '제휴'의 매치가 아니다 (복합명사는 별도 등재된
        경우에만 매치)
      context_window: context_required_events의 공기 검사는 문서 전체가 아니라 '같은 문장 또는 매치 토큰 전후 ±15 토큰' 윈도우에서 평가한다 — 골프 리뷰 페이지의 가격 '원'이 문서 반대편의 '라운드'를 승인해주는
        문서 단위 공기의 결함 차단
      adjacency_patterns: 'patterns_ko의 2-토큰 패턴([공장,착공] 등)은 인접(±2 토큰) 평가가 기본 — ''사업''과 ''철수''가 같은 문서에 있는 것과 ''사업 철수''는 다르다. 인명 방어: ''철수''류 인명
        동형 토큰은 직전 토큰이 성씨(김/이/박/최/정 등)이면 매치 불성립'
      person_name_guard_tokens:
      - 철수
      - 정상
      - 우수
external_impact_logic:
  enabled: true
  mode: shadow
  purpose: 포트폴리오 회사가 기사에 직접 언급되지 않아도, 해당 회사와 시간상 유효한 exposure를 가진 material external event를 causal impact로 연결한다.
  architecture:
    direct_route_invariant: core_logic.entity_match_required=true인 기존 Route A는 무변경. Route B는 별도 수집/판정 경로이며 direct entity를 위조하지 않는다.
    route_a_direct: Portfolio Company Entity → Article → Event → Materiality → Priority → Retention
    route_b_external: External Event → Exposure Match → Knowledge-Time Guard → Causal Mechanism → Materiality → Impact Link
    event_first_storage: 외부 사건을 먼저 dedup/cluster한 뒤 impacted portfolio companies를 impact_links로 attach
  qualification:
    require_all:
    - material_external_event
    - company_specific_exposure
    - knowledge_time_validity
    - causal_mechanism
    company_name_required: false
    broad_industry_only_is_invalid: true
    generic_commentary_is_invalid: true
    causal_sentence_required: true
    rule: 왜 이 사건이 이 특정 회사의 economics/product/regulation/competition에 영향을 주는지 한 문장으로 설명할 수 없으면 attach 금지
  knowledge_time_guard:
    valid_from_required: true
    valid_to_optional: true
    future_relation_use_forbidden: true
    rule: article.event_date < exposure.valid_from 이면 strict external match=false. 내부 contemporaneous evidence가 있으면 valid_from을 더 이른 날짜로 갱신 가능.
    hindsight_set: 현재는 관련성이 보여도 당시 exposure가 공개/내부적으로 확인되지 않았다면 oracle set으로 분리하고 recall score에서 제외
  event_families:
    policy_regulatory: 법·규정·정부 프로그램·조달·관세·허가/가이드라인 변화
    demand_market: 회사별 특정 수요 드라이버의 material expansion/contraction
    customer_counterparty: 확인된 고객/구매자/상대방의 capex·procurement·capacity·strategy 변화
    competition: 확인된 competitor/competing product/ecosystem의 material launch·pricing·clinical·partnership·shutdown
    technology_standard_ecosystem: 회사가 의존하는 표준·프로토콜·architecture의 release/adoption/integration/certification
    scientific_regulatory_readthrough: target/modality/indication/active ingredient/dosing format에 대한 타사 임상·허가·특허 read-through
    supply_chain_input: 핵심 input/material/component의 가격·공급·capacity·origin/export restriction 변화
    platform_infrastructure_dependency: 결제 rail·app store·distribution/API 등 구조적으로 의존하는 named infrastructure의 규칙/접근/fee 변화
    comparable_transaction: 검증된 peer의 IPO·M&A·funding·licensing·valuation reset 등 valuation/commercial comparable
  matching_rules:
    policy_regulatory:
      require:
      - specific policy domain
      - relevant jurisdiction
      - actual rule/program change
      reject:
      - general policy commentary
      - proposal with no material progression unless market-moving
    demand_market:
      require:
      - specific demand driver
      - company exposure
      - observable demand shock or policy driver
      reject:
      - generic market growth forecast
    customer_counterparty:
      require:
      - named verified customer/buyer
      - material capex/procurement/capacity/qualification event
      reject:
      - routine PR
      - unrelated customer event
    competition:
      require:
      - named verified competitor/competing product
      - material competitive event
      - specific overlap
      reject:
      - generic 'competition intensifies' commentary
    technology_standard_ecosystem:
      require:
      - named standard/protocol/architecture
      - release/adoption/integration/certification event
      reject:
      - broad technology trend only
    scientific_regulatory_readthrough:
      require_specificity_any:
      - target
      - modality
      - payload
      - indication
      - active ingredient
      - delivery/dosing format
      - patent family
      require_event_any:
      - clinical data
      - trial stop/hold
      - regulatory approval/rejection
      - licensing
      - patent expiry
      - safety signal
      reject:
      - broad oncology/ADC/GLP-1 keyword alone
    supply_chain_input:
      require:
      - named input/material/component
      - price/capacity/shortage/oversupply/export-origin event
      reject:
      - generic supply-chain commentary
    platform_infrastructure_dependency:
      require:
      - named platform/rail/infrastructure
      - fee/billing/access/API/launch/policy/outage/deprecation event
      reject:
      - unrelated platform corporate news
    comparable_transaction:
      require:
      - verified peer/comparable
      - IPO/M&A/funding/licensing/valuation event
      - peer similarity evidence
      reject:
      - same-industry company transaction with no meaningful similarity
  query_registry:
    principle: 회사별 쿼리를 무한 생성하지 않고 normalized exposure subject 기준으로 수집 후 회사에 attach
    deduplicate_shared_exposure_queries: true
    event_first: true
    query_components:
    - exposure.subject
    - allowed_event_families
    - required_event_context
    - jurisdiction/geography guards
    broad_term_query_prohibited:
    - AI
    - 인공지능
    - 반도체
    - 바이오
    - 로봇
    - 핀테크
    - 커머스
  source_strategy:
    priority:
    - regulator/government/court/standards_body
    - named_customer_counterparty_competitor_official
    - wire_service/high_quality_financial_press
    - trade_publication
    - general_media
    - commentary/social_discovery_only
    policy_rule: 정책·규제 사건은 가능한 한 원문 기관 source를 source_of_truth로 사용
  causal_judge:
    required_outputs:
    - impact_direction
    - impact_mechanisms
    - impact_confidence
    - causal_summary
    direction_values:
    - positive
    - negative
    - mixed
    - unclear
    mechanism_vocabulary_v0:
    - demand_expansion
    - demand_contraction
    - market_validation
    - technology_validation
    - target_validation
    - competitive_pressure
    - pricing_pressure
    - margin_pressure
    - compliance_cost
    - market_access
    - distribution_access
    - customer_capex_expansion
    - customer_loss_risk
    - supply_tightening
    - supply_relief
    - input_cost_increase
    - input_cost_decrease
    - valuation_comparable
    - strategic_optionality
    multi_mechanism_allowed: true
    party_direction_check: 규제/부실/거래의 직접 당사자와 포트폴리오사를 혼동하지 않는다. ecosystem impact는 direct obligation으로 서술 금지.
  materiality:
    default_floor: important_candidate
    context_only_if:
    - weak causal link
    - generic commentary
    - minor competitor PR
    - non-material platform change
    material_examples:
    - 규제 시행/폐지/핵심 가이드 변경
    - 정부 대규모 사업·조달
    - 검증된 고객의 대규모 capex/procurement
    - 경쟁사의 가격·제품·임상·유통구조 급변
    - 타사 핵심 임상 성공/실패 또는 승인/중단
    - major licensing/IPO/M&A/valuation comparable
    - patent cliff
    - 실제 demand/supply shock
    - named standard의 major revision/adoption
  output_contract:
    external_event: true
    required_fields:
    - external_event_family
    - exposure_id
    - portfolio_company
    - event_date
    - impact_direction
    - impact_mechanisms
    - impact_confidence
    - causal_summary
    - knowledge_time_valid
    - retention
    default_retention: retain
    default_notification_priority: none
    shadow_mode_rule: shadow 동안 external match는 production urgent/important notification feed에 들어가지 않는다.
    direct_event_compatibility: 같은 기사에 direct portfolio entity가 실제 등장하면 Route A도 독립적으로 실행. Route B 성과로 중복 credit 금지.
  dedup:
    cluster_external_event_before_company_attach: true
    cluster_key_components:
    - normalized_external_event_family
    - subject
    - event_date
    - counterparty_or_authority
    - transaction_or_program_id
    company_impact_links_after_cluster: true
  rollout:
    pilot_company_count: 13
    pilot_industry_coverage: 10
    golden_positive_cases: 36
    phase: shadow
    promotion_gate: direct regression clean + knowledge-time clean + broad-term negatives clean + causal explainability clean + precision calibrated
entity_resolution:
  states:
    confirmed_entity: 기존 entity gate 통과 (legal_name·등록 alias·제품·파이프라인· 구명·공식 영문명·partner_watch) — 종전과 동일하게 즉시 파이프라인 진행
    provisional_entity_candidate: 신뢰 목록에 없는 폴백 식별자로만 매치된 상태 — 기각이 아니라 검증 라우팅
    rejected_entity: confirmed도 아니고 검증도 실패 — wrong_entity discard
  provisional_entity_candidate:
    allowed_sources:
    - generated_romanization
    - official_website_metadata
    - official_source_english_name
    - newly_discovered_latin_name
    effect:
    - retrieve_article
    - fetch_body
    - route_to_entity_verification
    - do_not_treat_as_confirmed_entity_yet
    verification_signals:
    - 공식 회사 웹사이트/도메인 언급·링크
    - 공식 뉴스룸/보도자료 출처
    - DART·거래소 공시 연결
    - 특허 출원인 명의 일치
    - ClinicalTrials 스폰서 명의 일치
    - 규제기관 제출 문서 일치
    - 등록된 제품명 공기
    - 등록된 파이프라인 코드 공기
    - 알려진 창업자·경영진 이름 공기
    - 알려진 자회사·계열 관계 공기
    - 법인 주소·소재지 일치
    - 사업 서술이 회사 프로파일과 명확히 일치 (산업·제품·고객)
    - 알려진 파트너·고객 관계 공기
    - 복수의 독립적 정체성 속성 동시 일치
    verification_fail: '신호 부재·모순(다른 국가의 동명 기업, 다른 사업 서술) → rejected_entity, retention: discard(wrong_entity), alias 미등록. recall 확장이 정밀도를 파괴하지
      않았음을 보이는 경로 (E5)'
  alias_feedback:
    action: propose_english_alias
    requires:
    - confirmed_entity
    approval_any:
    - operator_confirmation
    - deterministic_official_source
    effect: 승인된 표기는 english_aliases 등록 → 이후 수집은 폴백이 아닌 신뢰 alias로 직접 진행 (폴백 의존 점진 축소)
  precision_constraint: 이 상태 머신은 폴백 식별자에만 적용된다. 한국어 entity 매치, forbidden_standalone, negative_terms, required_context 등 기존 gate 규칙은 일절 변경 없음
pipeline:
  layers:
    1_collection: 발견했는가 — 쿼리·폴링·recall의 문제. 여기서 실패하면 투자자가 볼 기회 자체가 소멸하므로 최우선 방어 대상
    2_classification: 어떤 종류의 회사 발전인가 — event_types 또는 company_update
    3_materiality: 얼마나 중요한가 — materiality_model + 각 패밀리 기준
    4_notification_priority: 지금 봐야 하는가 — urgent/important만 푸시. normal은 푸시 없이 피드·다이제스트로 제공
    5_retention: 피드에 남는가 — retain / retain_collapsed / discard
    1b_external_collection: 'Route B shadow: normalized external exposure subject로 사건 수집 → event cluster → exposure attach. direct entity 수집과
      분리하며 broad industry-only query 금지'
  principle: 계층 3~4(중요도·알림)의 낮은 판정은 계층 1(수집)과 5(보존)를 결정하지 않는다. 'not urgent'를 'not worth collecting'으로 취급하는 규칙은 이 스키마 어디에도 존재해서는 안 된다
  discard_only_if:
  - wrong_entity
  - duplicate_of_retained_event
  - pure_stock_price_noise
  - spam_or_seo
  - unrelated_content
retention_policy:
  values:
    retain: 피드에 전체 표시
    retain_collapsed: 피드에 접힌 그룹으로 보존 — 반복 PR, 스치는 언급(리스트 기사), 다량 루틴 공시(소액 옵션 행사 등), 경쟁사 맥락 기사
    discard: 완전 제거 — pipeline.discard_only_if 사유만 허용
  defaults:
    urgent: retain
    important: retain
    normal: retain
    company_update: retain
    passing_mention: retain_collapsed
    repetitive_pr: retain_collapsed
    unsupported_speculation: retain + speculation 플래그 — 근거 없는 M&A·IPO 관측도 시장 chatter로서 정보 가치가 있다. notification은 없음. 복수 주요 매체 반복 시 accumulation_rules로
      승격 후보 (v4.1의 ignore 완전 소멸을 대체)
    stock_move_only: discard — 단, 본문에 새로운 사실(공시·회사 발표 인용)이 있으면 그 사실을 사건으로 살려 retain (기존 downgrade_markers note와 일치)
  note: 'downgrade는 notification을 낮추는 것이지 기록을 지우는 것이 아니다. v4.1까지의 ''ignore''는 notification=none + retention=discard의 합성이었음 — 구 테스트의 expected_priority:
    ignore는 ''notification 없음''으로 읽고 retention은 expected_retention을 따른다'
accumulation_rules:
  purpose: 단건으로는 낮은 우선순위인 정보가 누적되면 투자 판단에 의미가 생긴다. 보존된 normal·company_update 항목이 이 규칙의 원료 — discard했다면 불가능
  weekly_digest: normal·company_update 항목은 회사별 주간 다이제스트로 묶어 제공 (푸시 아님)
  escalation_triggers:
  - '동일 테마 인사 이탈 반복: 90일 내 임원·핵심인력 이탈 2건 이상 → key_person_risk로 묶어 important 승격 검토'
  - '동일 대상 지연·차질 언급 반복: 같은 제품·프로젝트 지연 언급 2회 이상 → technology_setback 승격 검토'
  - '동일 방향 speculation 반복: 복수 주요 매체의 M&A·IPO·매각 chatter 3회 이상 → important 승격 검토 (speculation 플래그 유지)'
  - 가격·수수료 조정 반복 → pricing_monetization 수익모델 변화 신호로 승격 검토
  - 채용공고 급증/급감(선택 신호 수집 시) → workforce_change 방향 신호
  - 서비스 장애·고객 불만 반복 (90일 내 2건 이상) → 운영 리스크 신호로 승격 검토
  - 동일 신규 기술 아키텍처·플랫폼 반복 언급 → technical_review_candidate와 연동, 기술 방향 전환 신호로 승격 검토
  - 미등록 고객사·파트너 반복 언급 → partner_graph candidate 제안과 연동
  - 제품 릴리스 케이던스의 지속적 하락 (릴리스 노트·뉴스룸 주기 기준) → 개발 둔화 신호로 검토
  - 신기술 영역 주변 특허 출원 클러스터 (동일 기술 분류 출원 반복) → R&D 방향 신호로 검토
  post_escalation_rule: 승격은 '집계 사건'을 새로 만드는 것이며, 근거가 된 원 단건 기록(normal 항목들)은 절대 삭제·병합 소멸시키지 않는다 — 집계 사건이 원 기록들을 참조 링크로 가리킨다
  silence_monitoring:
    trigger: '기대-신호 기업(직전 활동: 대형 조달·공장 건립·IPO 절차·임상 진행 이력 보유)이 N개월(기본 6) 연속 수집 항목 0건 — 소스 인벤토리가 정상(healthy)인데도'
    action:
    - 운영자 검토 큐에 'company_gone_quiet' 항목 생성
    - 공시 직접 조회(DART/KIND — 상장·심사·폐업·감사보고서) + 뉴스룸/웹사이트 생존 확인
    - event_qualified 백스톱 전 패밀리 1회 강제 실행 (주기 완화 상태였다면 복원)
    distinction: 'source_coverage_health와 구분 — 그쪽은 ''소스가 죽었나'', 이쪽은 ''소스는 사는데 회사가 조용한가''. 둘 다 정상인데 조용하면 그 자체가 기록 (company_update: silence_flag,
      피드 보존)'
    three_layer_gate: silence 카운터는 (1) 뉴스 검색 (2) corporate_data_collector (headcount·재무·상태 변화) (3) 업계 전문지/공식 섹션 — 3계층이 '독립적으로 모두' 무신호일 때만 증가한다.
      뉴스만 조용한 회사는 silence가 아니라 소스 라우팅 대상
    site_staleness: official_company_sections 소스마다 site_last_updated_age를 기록. 임계(기본 18개월) 초과 정체 사이트는 '유효 소스'가 아니라 'broken에 준하는 저신뢰'로 강등 — 도달 가능하지만
      갱신이 멎은 페이지는 침묵의 확증이 아니라 소스 공백의 증거다. 강등 시 해당 회사의 침묵 판정은 나머지 2계층만으로 수행
  announcement_reality_cross_check:
    rule: '긍정 발표 사건(대규모 투자 유치·전략적 계약)과 corporate_data_collector의 실체 신호(인원 급감·유동비율 붕괴·자본금 미변동)가 같은 기간에 모순되면 contradiction 플래그를 생성해 important로 검토
      큐 투입. 실측: 메디노 — 2025-09 ''약 2,040억 단계적 중국 전략투자'' 발표 직후 2025-12 인원 -42%·유동비율 18.7%→1.9%. 발표와 실체가 정반대를 가리키는 교과서적 적신호였고, 뉴스 계층만으로는 원리상 불가시'
    guard: '모순 플래그는 사실 단정이 아니라 검토 신호 — ''발표가 허위''로 서술 금지, 두 신호를 병기하고 flags: [announcement_reality_gap]'
  committed_milestone_tracking:
    problem: 회사가 공개적으로 약속한 기한이 지났는데 아무 기사도 나오지 않는 경우. 지연을 보도하는 기사 자체가 없으므로 technology_setback 어휘(지연·연기)로는 원리상 잡히지 않는다. silence_monitoring은 '조용함'을
      감지하지만 '무엇이 약속됐는지'를 모른다
    historical_basis:
    - '엑시나(MetisX) 2024-12-16 PR: ''첫 ASIC 2025 상반기 출시'' + ''미국 브릿지 조달'' 명시 → 둘 다 H1 2025 미발생, 실제 Series B는 2026-05·MX1 공개는 2026-08. 18개월 무보도'
    - '피지티 2023-01: 군산 공장 ''2024-06 준공 목표'' → 준공·증설·양산 후속 보도 0건'
    - '지투지바이오 2026-04 IR: ''제2 GMP 공장 2026년 착공 예정'' → due-date 추적 대상'
    rule: 수집된 기사·IR 자료에서 회사가 스스로 밝힌 '기한 있는 마일스톤' (출시·준공·착공·상장·데이터 공개·조달 완료 등 + 시점 표현)을 감지하면 {milestone, stated_date, due_date, source} 레코드를 생성한다.
      due_date 경과 후 관련 후속 사건이 수집되지 않으면 'milestone_overdue'로 운영자 검토 큐 + 해당 회사 백스톱 강제 실행 + 공시 직접 조회
    materiality: 미도래 자체는 important 승격이 아니라 '검토 항목' — 조용한 지연은 technology_setback 후보이되 확인 없이 셋백으로 단정하지 않는다 (BT2-8 no_promotion_rule과 정합)
    implementation: 결정적 코드가 마일스톤 레코드·due_date 타이머 유지, judge는 기사에서 마일스톤·시점 표현을 추출
  implementation: 결정적 코드가 회사×테마별 카운터·타임윈도우 유지, 임계 도달 시 judge에 승격 검토 요청. 승격되어도 원 단건 기록은 피드에 그대로 유지
event_output:
  structure:
    detected_event_types: '긍정적으로 분류된 ''모든'' 사건 카테고리 — 우선순위와 무관. normal급 특허 출원도 intellectual_property로 여기 기록된다. 용도: 카테고리별 히스토리 조회 (희석 이력 전체·IP
      이력· 기술 개발 타임라인·인사 이력)'
    material_event_types: 'important/urgent로 판정된 카테고리만 — detected_event_types의 부분집합. 용도: 알림 피드·대시보드 하이라이트. (v4.1~4.2의 event_types와 동일 의미 — event_types는
      material_event_types의 하위 호환 별칭으로 유지)'
    primary_event: investor_priority_philosophy.ranked_impact_order 기준 최상위 사건 (ipo_integral_financing 예외 적용). material이 비어 있으면 detected 중 최상위
      (없으면 company_update)
    notification_priority: urgent / important / normal / none
    retention: retain / retain_collapsed / discard (retention_policy)
    event_subtypes: 사건별 subtype 맵 (ipo_stage, dilution_type, update_type 등) — detected된 사건마다 기록
    capital_structure_direction: capital_structure 사건이 detected에 있으면 필수 출력 (normal급 소액 부여라도 방향은 기록)
    technical_review_candidate: bool — company_update.technical_review 참조 (P1-3)
  rules:
  - 'detection ≠ materiality: 분류가 성립하면 우선순위가 normal이어도 detected_event_types에 구조적으로 기록한다. ''보존은 되지만 카테고리 조회가 불가능한 정보''는 인텔리전스가 아니라 창고다 (P0-3)'
  - 최상위 사건이 알림 우선순위를 결정하되, 모든 material 사건 태그를 보존한다. secondary material 사건 태그를 삭제·소멸시키는 것은 회귀 실패다
  - 'ipo_integral_financing: 신주 발행·공모 조달이 IPO 거래의 기계적 구성요소인 경우 primary_event=ipo. dilution·financing 태그는 유지. IPO와 무관한 별도 유상증자· CB라면 ranked_impact_order
    원칙대로 dilution이 primary'
  - notification 억제(normal/none)는 detected_event_types·event_subtypes·direction 등 분류 메타데이터에 어떤 영향도 주지 않는다
  - 'multi_event_extraction: 한 기사에 서로 다른 사건이 병존하면 각각을 별도 사건으로 추출한다 (detected_event_types에 병기하는 것을 넘어, 사건별 subtype·상대방·금액을 분리 기록). 실측: 일리미스 시리즈B
    보도자료(2025-07-14) 본문에 일라이릴리 GAIA 협력이 매립돼 있었고, 기사 단위 단일 분류였다면 bio_deal이 financing에 흡수돼 소멸. 본문 fetch가 필요한 대표 조건이며 body.fetch_when에 등재'
  - 'same_transaction_two_faces: 하나의 거래가 두 패밀리로 갈리는 경우 (실측: 지투지바이오 200억 CB = financing, 동시에 삼성바이오에피스 기술이전 = partnership/bio_deal — 같은 딜의 양면) 두
    사건을 병기하고 동일 transaction_id로 연결한다. 한쪽만 알면 상대방의 전략적 정체를 놓친다'
  downstream_routing:
    exhaustive_histories: detected_event_types 기준 — 희석 이력 전체·IP 이력· 기술 타임라인·인사 이력 조회는 normal급 포함 전부
    urgent_notification_feed: material_event_types + notification_priority 기준
    dashboards: 용도별 선택 — IPO 대시보드는 detected(준비 단계 포함 전체 추적) 또는 material(하이라이트만) 중 뷰 목적에 맞게. primary_event만으로 필터링하는 뷰는 금지 (v4.0 결함 재발 방지)
  examples:
  - text: A사, IPO 공모가 확정…신주 700만주 발행해 1,400억원 조달
    output:
      detected_event_types:
      - ipo
      - capital_structure_dilution
      - financing
      material_event_types:
      - ipo
      - capital_structure_dilution
      - financing
      primary_event: ipo
      notification_priority: urgent
      retention: retain
      ipo_stage: 공모가확정
      capital_structure_direction: dilution_increase
  - text: A사, 신규 특허 PCT 국제출원 (소규모·루틴)
    output:
      detected_event_types:
      - intellectual_property
      material_event_types: []
      primary_event: intellectual_property
      notification_priority: normal
      retention: retain
  - text: A사, 임직원 대상 발행주식수 0.1% 스톡옵션 부여
    output:
      detected_event_types:
      - capital_structure_dilution
      material_event_types: []
      primary_event: capital_structure_dilution
      notification_priority: normal
      retention: retain_collapsed
      capital_structure_direction: dilution_risk_increase
      note: 알림은 없지만 '이 회사 희석 이력 전부' 조회에 반드시 잡혀야 한다
