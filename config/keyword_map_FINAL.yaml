    - 거래상대방으로 기재된 모든 건
    authority_rule: 상대방의 공시는 후보 이벤트로 파이프라인에 투입하되 모든 해석의 전거로 자동 인정하지 않는다 — 금액·조건·성격은 judge가 본문으로 판정하고, 가능하면 당사 측 확인·공시와 교차
    entity_precision: 전문 검색에는 confirmed alias만 사용 (provisional·로마자 폴백 금지) — 공시 코퍼스는 노이즈 비용이 높음
  tech_recall_sources:
    ai_software:
      optional_poll:
      - github_releases
      - arXiv (회사·저자 매치)
      - Hugging Face (모델 릴리스)
    semiconductor_robotics:
      optional_poll:
      - 학회 프로시딩/발표목록 (ISSCC·Hot Chips·ICRA 등)
      - 표준화 기구 기고 (OCP 등)
    note: 기술 마일스톤이 보도자료 이전에 기술 채널에 먼저 나타나는 경우를 수집. entity 매치는 공식 계정·조직명 기준으로 결정적 판정
  optional_weak_signals:
    signals:
    - 'headcount_delta (BT4-N6: 채용 ''공고 수''를 대체하는 상위 신호 — 국민연금 가입자수 기반 월별 인원 증감. 실측: 메디노 -42%·유동비율 18.7%→1.9%, 원더플레이스 -43명이 전부 이 계층에만 존재했고 공고
      수로는 불가시. corporate_data_collector 경유)'
    - '채용공고 추이 (신규 직무·지역 — 방향 신호 보조. BT2-7: 승인된 채용 포털 직접 질의, 뉴스 파이프라인 차단과 별개)'
    - 앱스토어/스토어 릴리스 노트 (product cadence 신호)
    note: 선택 신호 — 기사화되지 않는 운영 신호. 수집 시 normal·다이제스트로만 제공
  corporate_data_collector:
    intentionally_queried:
    - thevc.kr
    - innoforest.co.kr
    - NICE평가정보/nicebizinfo
    - 혁신의숲 API
    signals:
    - headcount_delta(월별)
    - FY_재무(매출·영업손익·유동비율)
    - 투자이력 변경
    - 자본금 변경
    - 대표자 변경
    - 본점 이전
    - 휴폐업 상태
    cadence: 월 1회 전 포트폴리오 + silence_monitoring 대상은 주 1회
    event_rule: 수치 변화는 원칙 normal(다이제스트·detected 태그 보존)이되, 임계 초과 변화(인원 ±20%/분기, 유동비율 급락, 휴폐업 전환)는 workforce_change/negative 후보로 judge 투입
    industry_trade_press: 버티컬 전문지(어패럴뉴스·패션비즈·전자신문 벼룩·바이오스펙테이터 등) 를 산업별 direct_poll 후보로 등재 — 소비재·패션 M&A는 종합지가 아니라 업계지가 단독 보도한다 (로토토베베 실측)
  jurisdictional_corporate_registry:
    purpose:
    - ownership_monitoring
    - governance_monitoring
    - capital_structure_monitoring
    - legal_status_monitoring
    enable_if:
    - foreign_legal_entity
    - material_foreign_subsidiary
    - material_foreign_holding_company
    jurisdiction_adapters:
      GB:
        source: Companies House (find-and-update.company-information.service.gov.uk)
        access: 무료 — 웹 + 공식 API. 실조회 검증 완료 (filing history·PSC 전체 무료)
        document_types:
        - SH01(신주배정)
        - RES01/10/11/12(결의 — 배정권한·신주인수권배제)
        - PSC01-09(지배주주 등록·변경·소멸)
        - AP01/TM01(이사 선임·해임)
        - MR01/MR04(담보권 설정·해소)
        - CS01(확인서)
        - AA(연차계정)
        - strike-off/dissolution 절차 문서
      DE:
        source: Handelsregister + Unternehmensregister
        access: DiRUG(2022-08) 이후 무료 — 등기부 초본(AD/CD)·주주명부(Gesellschafterliste)· GmbH 연차계정. 세션 내 직접 검증은 미완(UNVERIFIED) — 배포 전 확인 필요
      SG:
        source: ACRA Bizfile
        access: 무료 티어 = 법인명·UEN·상태만. 이사·주주·납입자본은 유료 Business Profile (~S$5.5) — 저비용 유료. 운영 예산 승인 항목
      US:
        source: 주(州) 단위 분산 — Delaware는 소유·이사 미공개
        access: 실질적 무료 소유권 등기 부재 (검증됨). 외국법인 등록 주(Sunbiz 등)에서 임원 정보가 산발 노출되나 신뢰 불가 — 이 관할은 등기 계층 not_applicable, 타 계층(뉴스룸·와이어·임상 레지스트리)으로 커버
      other: jurisdiction_specific_official_registry — 어댑터 작성 후 등재
    collect:
    - share_allotment
    - share_capital_change
    - beneficial_owner_change
    - person_with_significant_control_change
    - director_appointment
    - director_termination
    - articles_change
    - shareholder_resolution
    - capital_resolution
    - preemption_right_change
    - registered_charge
    - security_interest
    - insolvency_status
    - strike_off
    - dissolution
    - annual_accounts
    - registered_office_change
    event_family_mapping:
      SH01_allotment: 'capital_structure_dilution (direction: dilution_increase, urgent)'
      preemption_disapplied: 'capital_structure_dilution.authorized_capacity 상당 (direction: dilution_risk_increase)'
      PSC_change: ma/governance — 지배주주 변경은 control 사건, urgent. 펀드가 PSC로 등록되면 소유 밴드(25-50% 등)를 서술에 명시
      director_changes: management_change (동시 다수 해임 + 신규 PSC = 지배구조 개편 체인으로 묶어 판정 — Infinitesima 2025-12 패턴)
      registered_charge: 부채·담보 신호 (BT5-D 참조) — important
      insolvency_strike_off_dissolution: negative, urgent
      annual_accounts: earnings.audited_report 경로로 라우팅
    timeliness_rule: '등기는 ''권위 있으나 적시성이 없다'' — 실측: PSC07이 효력 발생 2년 후, SH01이 12개월 후 제출된 사례. 사건 일자는 filed_date가 아니라 effective_date로 기록하고(둘 다 보존),
      지연 도착분은 타임라인 소급 삽입(lossless_collection time_semantics와 동일). 등기 지연은 뉴스 계층이 먼저 잡을 수 있음 — dedup가 병합'
    legal_entity_graph:
      relations:
      - parent
      - subsidiary
      - holding_company
      - controlled_entity
      - material_operating_subsidiary
      subsidiary_filing_rule: 자회사 등기가 곧 포트폴리오사 사건이 되지 않는다 — judge가 '이 정보가 감시 대상 법인에 경제적으로 영향을 주는가'를 판정. 단, 자회사 PSC 섹션이 모회사 지배 구조를 노출하는 경우(Chrono24
        UK → MPN GmbH) 그 사실 자체가 모회사 수준 인텔리전스다
      required_fields:
      - source_legal_entity
      - portfolio_entity
      - relationship
      - jurisdiction
      - registry_document_id
      note: 출처 법인과 포트폴리오 법인을 절대 병합하지 않는다 — 문서는 출처 법인에 귀속, 사건은 판정 후 포트폴리오 법인에 연결
    watermark: lossless_collection 적용 — 등기부별 최종 filing 커서 유지
  facility_project_public_records:
    enable_if:
    - known_factory_project
    - known_large_facility_project
    - facility_expansion_event_detected
    - committed_facility_milestone_active
    derive_search_scope_from:
    - known_project_address
    - registered_factory_address
    - municipality
    - industrial_complex
    - disclosed_project_name
    source_types:
    - municipal_notices(지자체 고시·공고 게시판 직접 폴링)
    - construction_records
    - safety_inspection_records
    - industrial_complex_authority(KICOX·새만금청 등)
    - building_permit_records(세움터 — 주소 키 건축물대장)
    - factory_registration_records(FactoryOn)
    - environmental_permits
    - public_investment_agreements(투자협약)
    implementation_constraint: 회사명 웹 검색으로는 원리상 불가(색인 안 됨) — 해당 지자체 게시판의 board-native 검색을 직접 폴링하고, 건축 단계는 프로젝트 주소로 세움터를 주기 조회한다. 이 제약 명시 없이 '검색으로
      수집'이라 구현하면 조용히 실패
    detectable_states:
    - announced
    - site_acquired
    - permit_requested
    - permit_granted
    - contractor_selected
    - groundbreaking
    - construction_active
    - inspection
    - completed
    - production_approved
    - operation_started
    committed_milestone_integration:
      progress_updates_milestone: '회사가 공표한 시설 마일스톤(예: ''2024-06 준공 목표'')의 due_date 접근 시, 공공기록에서 대응 진행 상태(검사·사용승인)가 확인되면 마일스톤 상태를 갱신하고 silence
        경고를 억제한다 — 회사가 조용해도 공사는 진행 중임을 공공기록이 증명하는 경우'
      absence_keeps_overdue: 반대로 기한 경과 + 회사 채널 침묵 + 공공기록에도 대응 진행 없음이면 기존 milestone_overdue 로직이 그대로 발동 — 공공기록 무신호가 overdue를 해제하지 않는다
    current_scope: 피지티(군산 전해질 공장 — 군산시·새만금청 게시판 + 프로젝트 주소), 지투지바이오(제2 GMP 공장 착공 예정 — 소재지 확정 시 등재)
  government_award_result_collector:
    separate_from_news_search: true
    program_registry_fields:
    - canonical_program_name
    - aliases
    - operator
    - ministry
    - official_result_source
    - application_cycle
    - expected_result_window
    - relevant_industries
    intentionally_query:
    - official_award_results
    - selection_notices
    - ministry_press_releases
    - program_operator_announcements
    - awardee_lists
    - project_database_updates(NTIS 등)
    detectable_states:
    - announced
    - application_open
    - applied
    - shortlisted
    - selected
    - agreement_signed
    - funding_awarded
    - project_started
    - renewed
    - expanded
    - completed
    - failed_selection
    - rejected
    - terminated
    lifecycle_no_promotion: '''지원/신청''을 ''선정''으로, ''선정''을 ''자금 수령''으로 승급 금지 — event_lifecycle no_promotion_rule과 동일 원칙. 실측: 스파크 KDDF 선정(6월)과 협약·보도(10월)의
      4개월 간극 — 상태별로 별도 사건'
    note: nipa.kr·bizinfo.go.kr 등은 뉴스 검색에서 blocked 유지 — 이 수집기에서는 의도적 질의
  dual_route_invariant:
    rule: blocked_in_news_search ≠ blocked_in_dedicated_collector. 뉴스 검색에서 차단된 도메인이라도 전용 수집기의 의도적 질의 대상일 수 있으며, 전역 차단 목록은 전용 수집기 설정에 절대 전파되지 않는다
      (파이프라인별 필터 분리)
    instances:
    - HR 포털 ↔ workforce collector (BT2-7)
    - 기업 DB ↔ corporate_data_collector (BT4-N6)
    - 정부 포털 ↔ government_award_result_collector (BT5-P1b)
    ci_check: 신규 차단 도메인 추가 시, 어떤 전용 수집기의 intentionally_query와 겹치는지 diff — 겹치면 명시적 파이프라인 스코프 선언 없이는 병합 실패
  debt_financing_minimal:
    verdict: 'ADD_minimal — 전용 news-search 패밀리 기각 (이벤트 볼륨 부족 + 대출 어휘의 치명적 충돌: 뱅크샐러드는 대출비교 사업자, 핀테크 대출상품 기사가 노이즈 대부분)'
    routes:
      audited_report_parser: '감사보고서 파서에 차입금 라인 추출 추가 — 단기/장기/장단기차입금, 시설자금대출, 담보제공 주석. ''잔액''이 아니라 ''증분''에만 발화: 신규 차입이 자기자본 20% 또는 100억 초과 시 financing(debt)
        important, 그 외 normal 보존. 정적 잔액(리디 40억 유지)은 무알림 (V445-8)'
      registry_charges: jurisdictional_corporate_registry.collect의 registered_charge(MR01)· satisfaction — 담보 설정은 차입의 등기 흔적 (Infinitesima 창 내
        0건 실측 — 채널은 유효하되 발화 빈도 낮음)
      news_narrow_terms: 'financing 패밀리에 협의 추가: 벤처대출, venture debt, credit facility, term loan (이상 4개만). ''대출''·''차입'' 단독 뉴스 어휘 금지'
    guards:
    - '대출: 뉴스 검색 어휘로 절대 단독 사용 금지 — 뱅크샐러드(대출비교)·핀테크 상품 기사·은행 상품 안내와 전면 충돌 (실측 노이즈 다수)'
    - '차입: 감사보고서·공시 문서 내부에서만 평가 (차입경영 논평·거시 기사 차단)'
    - '인수금융: ma 패밀리 유지 — 중복 등재 금지'
  search_engines:
    role: supplement_and_recall_backstop — event_qualified_queries와 함께 사용
    depth_rule: 고뉴스볼륨 회사는 결과 상위 페이지가 주가·SEO로 포화됨 — 날짜 윈도우 분할 + 페이지네이션 심화로 recall 확보 (상위 N건 스캔으로 끝내지 말 것)
lossless_collection:
  invariant: 일시적 소스 장애는 '지연 수집(delayed ingestion)'을 낳아야지 '영구 손실(permanent loss)'을 낳아서는 안 된다. 어떤 direct-poll 소스에서도 'latest N items'에만 의존하는 수집 금지
    — 장애 중 발행된 문서가 N개 밖으로 밀려나면 영원히 소멸한다
  contract:
    maintain_source_watermark: 소스별 '마지막 성공 처리 경계'(워터마크) 영속 저장 — 가능하면 소스 고유 커서(DART 접수번호·API cursor·게시 ID), 차선으로 발행 타임스탬프
    advance_watermark_only_after_successful_processing: 수집 성공이 아니라 '처리(파싱· 판정 큐 투입) 성공' 후에만 전진 — 부분 페이지 처리 실패 시 해당 배치의 워터마크 전진 금지
    overlap_previous_collection_window: 매 수집은 직전 워터마크보다 과거로 중첩 구간을 두고 시작 — 지연 인덱싱(발행 T1, 색인 T2) 문서 회수
    paginate_until_previous_watermark_reached: 새 항목이 페이지 한도보다 많아도 직전 워터마크에 도달할 때까지 페이지네이션 계속
    retry_failed_sources: 지수 백오프 재시도 + 실패 지속 시 운영자 알림
    backfill_after_outage: 복구 후 첫 수집은 장애 시작 시점 워터마크부터 백필
  time_semantics:
    publication_time_vs_ingestion_time: 이벤트 타임라인·dedup은 발행시각 기준, 워터마크·수집 진행은 수집시각과 분리 관리. 늦게 수집된 문서도 발행시각 위치에 배치 (피드 소급 삽입 허용)
    delayed_indexing: 검색엔진 소스는 색인 지연을 가정 — 중첩 윈도우를 소스별 관측 지연 분포에 맞춰 설정 (기본 최소 48시간)
    date_resolution_ladder:
      order:
        1: 구조화 데이터 (RSS pubDate, JSON-LD datePublished, 공시 접수일)
        2: 본문 fetch 후 기사 날짜 파싱
        3: 공시·1차 소스 교차 확인 (DART/KIND 접수일, 와이어 발행일)
        4: '매체별 기사 ID 서열 보간 — 반드시 date_approx: true 플래그'
      output_flag: 'date_approx: true인 항목은 타임라인에 근사 표시. urgent 알림은 1~3단계 검증 날짜 또는 명시적 date_approx 플래그 없이 발송 금지 (날짜 불명 urgent를 확정 일자처럼 서술하면 회귀
        실패)'
      fetch_blocked_fallback: '본문 fetch가 차단되는 매체(백테스트 실측: ktnews·apparelnews· dealsite 등)는 공시·타 매체 동보도로 교차 검증'
  source_health:
    monitor:
    - 연속 실패 횟수
    - 마지막 성공 시각
    - 수집량 급감(평시 대비)
    - 워터마크 정체
    alert_rule: 워터마크가 임계 시간 이상 정체된 direct-poll 소스는 운영자에게 경보 — '조용한 수집 중단'이 최악의 leakage 모드
  duplicate_safety: 중첩 수집이 만드는 재수집 문서는 duplicate_handling(문서 ID· transaction_identity)이 흡수 — 중복 이벤트를 만들면 안 되고, 중복을 피하려고 중첩을 없애서도 안 된다 (L4 테스트)
  applies_to: 모든 direct_poll 소스 (DART·KIND·뉴스룸 RSS·ClinicalTrials·규제기관· 특허DB·파트너 뉴스룸) + 검색엔진 날짜 윈도우
source_inventory:
  per_company_slots:
    official_newsroom:
      status_values:
      - configured
      - not_found
      - not_applicable
      - broken
      - expected_but_unconfigured
      note: 섹션별 서브슬롯 — official_company_sections 참조
    english_newsroom:
      status_values:
      - configured
      - not_found
      - not_applicable
      - broken
      - expected_but_unconfigured
    exchange_disclosure:
      status_values:
      - configured
      - not_applicable
      - expected_but_unconfigured
      - broken
      note: DART corp_code + KIND
    clinical_registry:
      status_values:
      - configured
      - not_found
      - not_applicable
      - broken
      - expected_but_unconfigured
      note: ClinicalTrials 스폰서 명의
    patent_sources:
      status_values:
      - configured
      - not_found
      - not_applicable
      - broken
      - expected_but_unconfigured
      note: KIPRIS·USPTO 출원인 명의
    regulatory_sources:
      status_values:
      - configured
      - not_found
      - not_applicable
      - broken
      - expected_but_unconfigured
    verified_partner_newsrooms:
      status_values:
      - configured
      - not_found
      - broken
      - expected_but_unconfigured
      note: partner_graph verified 상대방마다 1슬롯
    corporate_registry:
      status_values:
      - configured
      - not_found
      - not_applicable
      - broken
      - expected_but_unconfigured
      note: BT5-P0 — 외국 법인·중요 해외 자회사/지주 보유 회사. 관할 어댑터 존재 + 접근 가능(무료 또는 승인된 유료)이면 expected. US처럼 무료 소유권 등기가 없는 관할은 not_applicable(사유 기록)
    facility_public_records:
      status_values:
      - configured
      - not_applicable
      - expected_but_unconfigured
      - broken
      note: BT5-P1a — enable_if 조건 충족 회사만 expected (활성 시설 프로젝트·공표 마일스톤 보유)
  status_semantics:
    configured: 폴링 중 — lossless_collection 워터마크 보호 하에 있음
    not_found: 탐색을 시도했으나 해당 소스가 존재하지 않음 확인 (재탐색 주기 대상)
    not_applicable: '회사 유형상 해당 없음 (예: 비상장사의 exchange_disclosure)'
    broken: 설정돼 있었으나 접근 불능(404·피드 중단·포맷 변경) — 워터마크는 보존
    expected_but_unconfigured: 회사 유형상 기대되는데 설정이 없음 — 가장 위험한 상태, 즉시 경고 대상
    rule: 네 가지 부정 상태를 동일 취급하지 않는다 — not_applicable만 무경고
  expectations_by_company_type:
  - 한국 상장사 → exchange_disclosure(DART corp_code + KIND) 기대
  - bio_drug → clinical_registry·regulatory_sources 기대 (해당 파이프라인 존재 시)
  - verified_partner 보유 회사 → 해당 partner newsroom 기대
  - 모든 회사 → official_newsroom 탐색 시도 필수 (없으면 not_found로 기록, 미시도 상태로 방치 금지)
  - 영문 뉴스룸 운영 확인된 회사 → english_newsroom 기대
source_coverage_health:
  warn_if_expected_source_unconfigured: true
  warn_if_configured_source_becomes_unreachable: true
  periodic_source_discovery_recheck: not_found·broken 소스는 주기 재탐색 (뉴스룸 개설·URL 이전 감지). 신규 verified partner 발생 시 슬롯 자동 생성
  broken_source_rule: broken 전환 시 워터마크 유지 — 복구 후 lossless_collection 백필이 공백 구간을 회수한다. 삭제·재생성으로 워터마크를 잃으면 실패
  dashboard: 회사×슬롯 상태 매트릭스 — expected_but_unconfigured와 broken은 운영자 큐에 상시 노출
operational_readiness:
  source_state_ladder:
    1_architecture_supports: '스키마가 이 소스 클래스를 정의함 (예: ''DART를 폴링한다'')'
    2_source_discovered: 이 회사의 구체 소스가 식별됨 (corp_code·뉴스룸 URL·스폰서명)
    3_source_configured: 폴러에 실제 등록됨
    4_source_healthy: 최근 폴링 성공 + 워터마크 전진 중
    5_source_leaking: 위 어느 단계든 실패 중 — 이 소스 경유 정보는 현재 새고 있음
  monitoring_ready_gate:
    rule: 필수(mandatory) 소스 중 하나라도 expected_but_unconfigured·미해결(not_found 재탐색 미완)·unhealthy(broken/워터마크 정체) 상태면 그 회사는 monitoring_ready로 표시될 수
      없다
    mandatory_sources_by_profile:
    - '한국 상장사: DART corp_code + KIND 설정·healthy'
    - '한국 상장사: KIND irReference는 조건부(BT4-C1 — IR/PR 비율 트리거 충족 회사만 mandatory, 그 외에는 optional). v4.4.3의 전면 필수화는 1개사 과일반화로 철회'
    - '전 회사: 감사보고서 소스 경로 확정 (공고 섹션·회사 호스팅·DART 중 하나) — 비상장사 연간 재무의 유일 창구 (BT3-1b)'
    - '전 회사: official_company_sections 탐색 완료 (발견 섹션 configured 또는 not_found/not_applicable 확정)'
    - 'bio_drug(해외 임상 보유): clinical_registry 스폰서명 설정'
    - 'verified_partner 보유: 해당 partner newsroom 설정'
    briefing_disclaimer: 일일 브리핑은 monitoring_ready가 아닌 회사를 사유와 함께 명시 표시한다 — '조용함'과 '안 보고 있음'을 구분해서 전달. 비준비 회사의 무소식은 무소식이 아니라 커버리지 공백이다
    foreign_company_rule: BT5-P0 — 접근 가능한 공식 등기부가 존재하는 외국 법인은 corporate_registry 설정 없이 monitoring_ready가 될 수 없다. '구글 검색이 되고, 뉴스룸이 설정됐고, 영문 쿼리가
      돈다'는 것은 외국 회사의 완전 감시가 아니다 — Infinitesima 2025-12 지배구조 변경 체인은 그 세 경로 전부에 존재하지 않았다
    current_known_gaps: ops_actions_v4_4_1의 미완 항목(브이씨 등 상장 6사 DART 설정, zymedi 뉴스룸)은 해결 전까지 해당 회사 monitoring_ready 차단
  principle: 이론적으로 올바른 스키마도 직접 소스가 실제 연결되지 않으면 불완전한 브리핑을 생산한다 — 준비 상태는 스키마 속성이 아니라 운영 속성이며, 게이트는 그 간극을 브리핑 소비자에게 보이게 만든다
partner_graph:
  problem: partner_watch는 이미 아는 상대방만 보호한다. 신규 고객·파트너의 첫 발표는 외부 기사(특히 영문)에서 먼저 나타난다 — 그 기사 자체는 회사 entity가 등장하므로 baseline 검색으로 발견 가능하며, 그래프는 '다음'
    기사를 위해 자란다
  statuses:
    candidate_partner: 자동 제안 상태 — 모니터링 강도 최소 (해당 상대방 발표는 피드 전용)
    verified_partner: 공식 소스 확인 또는 운영자 승인 — partner_watch와 동일 대우 (뉴스룸 폴링·사건 후보 승격)
    historical_partner: 과거 관계 종료 — 재등장 감시용 저강도 유지
    inactive_partner: 오탐·무효 판정 — 재제안 억제
  candidate_proposal_triggers:
  - 회사 + 미등록 조직명이 공급·채택·qualification·라이선스·계약 문맥에서 반복 공기 (단일 기사로는 제안만, 자동 등록 금지)
  - 회사 또는 상대방의 공식 소스(뉴스룸·공시·규제 제출)가 관계를 명시 → 즉시 verified 승격 가능
  - 규제·공시 문서에 신규 상대방 등장 (DART 계약 공시의 거래상대방 등)
  - accumulation_rules의 '미등록 고객사 반복 언급' 트리거와 연동
  safety:
  - 한 건의 모호한 기사로 자동 신뢰·영구 등록 금지 — candidate는 판정 보조 신호일 뿐 entity 매치 규칙을 바꾸지 않는다
  - candidate 상대방 이름이 일반어와 충돌하면 forbidden_standalone 규칙 준용
  - 운영자 검토 큐 제공 — verified 승격은 공식 소스 근거 또는 수동 승인
  effect: 모니터링 그래프가 시간이 지날수록 좋아진다 — 수동 설정 완전성에 대한 의존을 구조적으로 낮춤
  first_announcement_independence:
    rule: '미등록 상대방의 ''첫'' 발표 기사 발견·분류·보존은 파트너 등록 여부에 일절 의존하지 않는다. 경로: baseline 영문/국문 발견 → 포트폴리오 회사 entity 확정(필요 시 entity_resolution 검증) → partnership/customer
      사건 분류 → 보존 → 상대방을 candidate_partner로 제안. partner_graph가 첫 사건을 잡기 위한 전제조건이 되면 아키텍처 실패 (E3)'
judge_rules:
  step_1_entity:
    pass_if:
    - legal_name_match
    - alias_match
    - product_or_pipeline_match
    - former_name_match
    - official_english_name_match
    - counterparty_watch_match
    fail_if:
    - negative_term_substring_only_match
    - forbidden_standalone_without_required_context
    - context_term_only_match
    provisional_path: 'P0-1: 폴백 식별자(로마자 변형·웹사이트 메타데이터·공식 소스 영문 표기)로만 매치된 기사는 fail이 아니라 provisional_entity_candidate — entity_resolution.verification_signals로
      본문 검증 후 confirmed(진행) 또는 rejected(wrong_entity discard). 한국어 entity·등록 alias 매치 규칙에는 영향 없음'
  step_2_event:
    pass_if:
    - common_event_match
    - industry_event_match_for_company_industry
    - state_transition_match
    - material_pattern_match
    fallback: 'ARCH-1: 어떤 이벤트에도 매치되지 않으면 fail이 아니라 company_update로 분류한다 (entity가 성립한 기사에 step_2 탈락은 존재하지 않는다). update_type 부여: executive_commentary
      / newsroom_post / industry_coverage / passing_mention / other'
    context_required_check: context_required_events에 걸린 단어는 지정 문맥 토큰 공기 시에만 pass (수요예측·청약·CB·BW·reset·유증·소각·RSU·기술성평가·setback 범용어· 선임·사임·해지·분할·장애·유출
      포함)
    negative_context_check: negative_context가 정의된 단어(유증 등)는 required 문맥 없이 negative 토큰만 공기하면 해당 '이벤트 매치'만 기각 — 기사 자체는 entity 성립 시 company_update로
      보존
    fp_watchlist_check: v4.4.3r FIX-2 — context_required를 통과했더라도 매치 근거 용어가 false_positive_watchlist에 등재돼 있으면 judge는 해당 항목의 risk 서술을 읽고 오탐 가능성을
      명시적으로 재검토한다. 이로써 고아 상태였던 watchlist가 실제 판정 경로에 연결된다 (차단이 아니라 2차 주의 계층)
  step_3_materiality:
    urgent_if:
    - ipo_material_progression
    - actual_material_dilution
    - material_dilution_reduction
    - financing
    - ma
    - severe_negative
    - regulatory_approval_or_hold
    - clinical_failure
    - rights_return
    - major_license_or_option_exercise
    - core_technology_program_halted
    - audit_opinion_refusal_or_adverse
    - major_regulatory_sanction
    - major_customer_or_partner_loss
    - severe_security_incident
    - mass_layoffs_cash_signal
    important_if:
    - ipo_preparation_stage
    - credible_prospective_dilution
    - material_equity_grant
    - authorized_capacity_material_increase
    - overhang_supply_by_float_ratio
    - technology_milestone
    - technology_setback
    - clinical_progress
    - commercial_adoption
    - customer_validation
    - major_contract
    - patent_grant
    - major_product_launch
    - strategic_pivot
    - material_earnings_development
    - content_rights
    - key_person_change
    - workforce_reduction
    - customer_or_contract_loss
    - corporate_structure_change
    - governance_material
    - pricing_model_change
    - security_incident
    - regulatory_sanction_moderate
    - major_facility_expansion
    - confirmed_geographic_expansion
    - government_grant_or_project
    normal_if:
    - conference_attendance_without_new_data
    - routine_pr
    - minor_feature_update
    - generic_commentary
    - pr_gated_term_without_evidence
    - small_routine_equity_grant
    - minor_short_delay
    - company_update_catchall
    - patent_application
    - routine_hiring_news
    - routine_agm_notice
    - minor_price_adjustment
    no_notification_but_retain_if:
    - unsupported_speculation
    - repetitive_pr
    - passing_mention
    - competitor_context
    discard_if:
    - unrelated_entity
    - stock_move_only
    - spam_or_seo
    - duplicate_event
    multi_event_rule: 복수 사건 동시 매치 시 event_output 규칙 적용 — ranked_impact_order 최상위 사건이 primary_event와 알림 우선순위를 결정하되, important 이상인 모든 사건 태그를 event_types에
      보존한다. secondary 태그 삭제 금지. IPO 구성요소인 발행·조달은 primary=ipo. (v4.0 conflict_rule의 '상위 사건 기준 단일 분류'를 대체)
  polarity_guards:
    denial_framing:
      pattern_ko:
      - 무산 아냐
      - 철회 아냐
      - 사실무근
      - 부인
      - 아니라고 밝혔다
      - 해명
      - 반박
      pattern_en:
      - denies
      - refutes
      - no truth to
      - pushes back on
      rule: '부정 사건 어휘 + 부인 표현이 공존하면 ''확정 사건''이 아니라 ''보도된 의혹에 대한 회사 부인''으로 분류한다. notification은 유지하되(투자자는 소문과 부인을 모두 알아야 함) 사실 확정으로 서술 금지 — flags:
        [denied_by_company, unconfirmed]. 실측: 라포랩스 ''SK스토아 인수 철회 아냐''(2025-11), 지투지 ''빅파마 딜 무산 아냐''(2026). 둘 다 순진한 키워드 매칭이면 확정 결렬로 오독된다'
    distressed_party_direction:
      rule: '회생·법정관리·파산 어휘가 공기해도 ''누가 부실 당사자인가''를 먼저 판정한다. 포트폴리오사가 인수자(acquirer)이고 부실 대상이 타깃이면 ma(urgent, 기회)로 분류하며 negative로 뒤집지 않는다. 포트폴리오사
        자신이 회생 대상일 때만 negative. 실측: 오아시스마켓의 티몬 인수(2025-06-23)는 회생절차 내 스토킹호스 M&A로, 기사 전체가 회생·변제율·채권자 어휘로 덮여 있으나 오아시스에게는 긍정 사건'
      distressed_ma_vocab:
      - 스토킹호스
      - 회생계획
      - 회생계획인가
      - 변제율
      - 인수대금
      - P플랜
      - 회생 M&A
    euphemism_expansion:
      rule: '회사는 자사 셋백을 완곡하게 발표한다 — 기자의 어휘가 아니라 회사의 어휘로도 매칭해야 한다. 실측: Chrono24가 ~25% 감원을 ''streamlines organizational structure''로 발표(2025)'
      workforce_ko:
      - 조직개편
      - 조직슬림화
      - 효율화
      - 인력재배치
      - 조직재정비
      workforce_en:
      - streamlines organizational structure
      - organizational realignment
      - reorganization
      - rightsizing
      - workforce optimization
      guard: 완곡어는 단독으로 workforce_change 확정 불가 — 규모·비율·인원 수치 또는 외부 보도 확인과 공기할 때만 감원으로 판정 (일반 조직개편 오탐 방지)
    sentiment_object_separation:
      rule: 기사의 부정적 프레이밍이 사건 자체의 극성을 결정하지 않는다. '만년 적자 A사에 5,600억 베팅…특혜 논란'의 사건은 government_grant/financing (긍정)이고 부정 어휘는 수식어다. 반대로 긍정 프레이밍의 부정
        사건도 동일 — 사건 극성은 상태 전이(state transition)로 판정하고 논조로 판정하지 않는다
  step_4_confirmation:
    confirmed_terms_preferred: true
    rumor_terms_reduce_priority: true
    rumor_exceptions: materiality_model.rumor_or_expectation.exceptions 적용 — 확정 일정의 '예정', dilution certainty_ladder, 회사가 직접 밝힌 IPO 계획(important
      유지)
    official_source_increases_confidence: true
  output_contract:
  - 'detected_event_types: 긍정 분류된 모든 카테고리 — 우선순위 무관 (P0-3). 매치가 없으면 [company_update]'
  - 'material_event_types: important 이상 카테고리만 (detected의 부분집합). 구 event_types 필드는 이 필드의 별칭'
  - notification 임계치는 detected_event_types를 절대 축소하지 않는다 — normal급 특허 출원도 intellectual_property로 detected에 기록
  - 'technical_review_candidate: company_update.technical_review 신호 감지 시 true'
  - primary_event + notification_priority (단일)
  - 'event_subtypes: 사건별 subtype (ipo_stage / dilution_type / update_type 등)'
  - 'retention: retain / retain_collapsed / discard — 매 기사 필수 (ARCH-10). discard는 discard_only_if 사유 명시 필수'
  - capital_structure 사건 포함 시 capital_structure_direction 필수
  - dilution_reduction 사건을 '희석 증가'로 서술 금지 — '희석 리스크 감소' 명시
  - technology_setback은 방향이 negative임을 요약문에 명시
  - speculation 보존 시 unconfirmed/speculation 플래그 필수 (확정 사실처럼 서술 금지)
  duplicate_handling:
    deduplicate_by:
    - company
    - normalized_event_type
    - event_subtype
    - event_date
    - counterparty
    - pipeline_or_product
    transaction_identity:
      applies_to:
      - financing
      - capital_structure_dilution
      discriminators_use_any_available:
      - disclosure_id
      - issuance_id_or_series
      - amount
      - counterparty
      - maturity
      - conversion_price
      - transaction_identifier
      rule: '판별자 중 하나라도 상이하면 (company, date, type, subtype)가 같아도 별개 사건. dedup은 ''같은 거래(transaction)의 중복 보도''만 병합하며, ''같은 날 같은 subtype의 서로 다른 거래''를
        병합해서는 안 된다. 예: 오전 ''200억원 CB 발행''과 오후 ''별도 300억원 CB 발행''은 금액·회차가 달라 2건 유지. 같은 300억 CB를 다룬 조간·석간 기사는 1건으로 병합'
      korean_disclosure_rule: 한국 공시 기반 사건은 DART 접수번호(문서 식별자)를 최우선 결정적 판별자로 사용한다
    prefer_source_order: source_priority
    note: 예심 청구(4월)와 예심 승인(7월)은 event_subtype이 달라 별개 사건. 같은 단계를 다룬 여러 매체 기사만 병합
  step_1b_external_impact:
    runs_only_for_route_b: true
    pass_if_all:
    - material_external_event
    - company_specific_exposure_match
    - knowledge_time_valid
    - causal_mechanism_explainable
    fail_if:
    - broad_industry_only
    - generic_commentary_only
    - event_before_exposure_valid_from
    - wrong_jurisdiction_without_cross_border_mechanism
    - named_counterparty_but_unrelated_event
    - peer_without_similarity
    - causal_link_unexplainable
    output: external_impact_logic.output_contract
collection_rules:
  query_generation:
    use_legal_name: true
    use_aliases: true
    use_former_names: true
    use_official_english_names: true
    use_product_and_pipeline_codes: true
    use_counterparty_watch: true
    do_not_search_forbidden_standalone: true
    do_not_search_context_terms: true
    one_entity_per_query: '쿼리당 entity 1개 강제 — 다중 엔티티 OR 결합 쿼리는 개별 리콜을 주지 않고 퍼지 오매칭으로 붕괴한다 (실측 0/4: 식료품 전단·게임 패치노트 반환)'
    no_bare_year_token: 쿼리에 연도 토큰('<사명> 2026' 형태) 단독 결합 금지 — 채용 애그리게이터의 자동생성 '연도 기업정보' 페이지에 100% 하이재킹됨 (실측 6/6사 재현). 기간 한정은 검색엔진 날짜 연산자·수집 윈도우로만
  blocked_domains_global:
    scope: news_retrieval_pipeline_only
    hr_portals:
    - saramin.co.kr
    - jobkorea.co.kr
    - jobplanet.co.kr
    - catch.co.kr
    - wanted.co.kr
    - incruit.com
    stock_forums:
    - alphasquare.co.kr
    - thinkpool.com
    - 38.co.kr
    - stockplus.com
    - paxnet.co.kr
    - ustockplus.com
    - wisereport.co.kr
    company_db_profiles:
    - thevc.kr
    - innoforest.co.kr
    - nicebizinfo.or.kr
    - demoday.co.kr
    - tracxn.com
    - pitchbook.com
    - cbinsights.com
    - crunchbase.com
    - leadiq.com
    - zoominfo.com
    government_notice_portals:
    - nipa.kr
    - bizinfo.go.kr
    - aiinfrahub.kr
    db_profile_rule: company_db_profiles는 뉴스 검색에서 차단하되, 영문 결과가 이들로만 채워진 상태는 별도 신호로 기록한다 — english_monitoring. null_result_disambiguation 참조 (침묵
      vs 언어 갭 구분)
    commerce_listings:
    - coupang.com
    - smartstore.naver.com
    - 11st.co.kr
    - gmarket.co.kr
    - auction.co.kr
    - danawa.com
    - enuri.com
    - ohou.se
    retail_investor_forums:
    - teamblind.com
    workforce_signal_exception: hr_portals는 뉴스 검색에서만 차단된다. workforce weak-signal collector(source_collection.optional_weak_signals)는 승인된 채용 포털을
      '의도적으로' 직접 질의한다 — 채용 가속/급감, 신규 직무 (규제·임상·제조 채용), 지역 확장, 채용 동결 신호 수집. 전역 차단 목록이 이 전용 수집기를 비활성화하면 회귀 실패 (V442-7). 구현상 두 파이프라인은 필터 설정을 공유하지
      않는다
    note: 기사 도메인이 아니라 '기업정보/채용/시세/주주토론' 페이지 유형 차단이 목적 — 해당 도메인의 뉴스 섹션이 존재하면 예외 등록 가능. 회사별 blocked_domains (리디 ridibooks.com, 블룸에이아이 bloom-ai.me
      등)와 합집합 적용. 자사 스토어·이벤트 페이지 매몰형(리디 사례)은 회사별 목록에서 관리
  company_record_schema:
    english_monitoring_fields:
      official_english_name: string | null
      english_aliases: list[string]
      english_product_names: list[string]
      pipeline_codes: list[string]
      foreign_clinical_activity: bool (해외 임상 이력)
      foreign_regulatory_activity: bool (FDA/EMA 등 해외 규제기관 활동)
      international_partnership_history: bool (해외 라이선스·파트너십 이력)
      overseas_business: bool (수출·해외법인 등 실질 해외 사업)
    population_note: 'boolean 필드는 운영자가 회사 온보딩 시 채운다. 미기입(null)은 false가 아니라 ''미확인''으로 취급한다. P0-1: 이 필드들은 영문 모니터링의 ''깊이(enhanced)''만 결정하며, 영문 모니터링
      자체는 필드와 무관하게 전 회사 baseline으로 켜져 있다'
  languages:
    korean: true
    english_monitoring:
      invariant: 온보딩 메타데이터 미기입이 영문 발견을 완전히 차단해서는 안 된다. 해외 고객사의 qualification 발표, 파트너의 계약 종료 발표, 영문 전용 회사 발표, 해외 규제기관 발표는 한국어 필드가 비어 있어도 존재한다
      baseline:
        enabled_for_all_portfolio_companies: true
        sources:
        - english_search_engine
        - major_english_business_media
        includes:
        - 영문 entity 기반 발견 (entity_discovery_fallback 식별자 사용)
        - 영문 고우선 event-qualified 백스톱 전 패밀리 (english_templates + technology/capital_structure recall families)
        cadence: enhanced 대비 낮은 빈도 허용 — 그러나 0이 되어서는 안 됨. '주기 완화'는 허용, '패밀리 누락'은 불허 (event_qualified_queries scheduling_note와 동일 원칙)
      enhanced_if_any:
      - official_english_name != null
      - english_aliases 비어있지 않음
      - english_product_names 비어있지 않음
      - pipeline_codes 비어있지 않음
      - foreign_clinical_activity == true
      - foreign_regulatory_activity == true
      - international_partnership_history == true
      - overseas_business == true
      enhanced_sources:
      - BusinessWire
      - PRNewswire
      - GlobeNewswire
      - foreign_industry_media
      - partner_newsrooms
      - relevant_regulatory_sources
      enhanced_effect: '고빈도 폴링 + enhanced_sources(와이어·해외 산업지·파트너 뉴스룸· 규제 소스) 추가. 예: 올릭스, 오름테라퓨틱, 이뮤노포지, 자이메디, 파로스아이바이오, 스파크바이오파마, 지투지바이오, 업스테이지,
        베슬에이아이, 큐픽스, 이마고웍스, 위로보틱스, 라이온로보틱스, 엑시나, Infinitesima, KaliVir, MPN, PORTONE 등'
      invariant_p1_1: enhanced는 '주기와 소스 깊이'만 바꾼다 — 고우선 영문 쿼리 패밀리의 존재 여부를 결정하지 않는다. 어떤 회사도 enhanced가 아니라는 이유로 영문 financing/IPO/dilution/technology
        백스톱을 잃지 않는다 (EN6)
      null_result_disambiguation:
        detect: 영문 결과가 company_db_profiles 도메인으로만 채워지고 뉴스 도메인 0건
        state: ko_check_required
        action: 해당 회사·기간에 대해 한국어 경로(entity_ko + event_qualified_ko + official_company_sections) 강제 실행 후 재판정. 한국어에서도 0건이면 비로소 silence로 확정하고 silence_monitoring
          카운터에 반영
        rationale: 영문 null을 침묵으로 오독하면 KO-first 기업(큐픽스·메이크스타·PortOne)의 활동 전체가 '조용한 회사'로 잘못 기록된다
      entity_discovery_fallback:
        purpose: official_english_name이 없는 회사의 baseline 영문 검색어 생성
        identifier_sources_in_precision_order:
        - 레코드의 라틴 문자 alias·제품명·파이프라인 코드 (기존 필드 — 최고 정밀)
        - 회사 공식 웹사이트·뉴스룸 메타데이터의 영문 표기 (og:site_name, 영문 페이지, 사업자 영문 등록명) — 발견 시 english_aliases 후보로 운영자 확인 후 등록
        - 공식 소스(DART 영문 공시·특허 출원인 영문 표기·ClinicalTrials 스폰서명)에서 발견된 영문 표기
        - '표준 로마자 표기 변형 (RR 표기 + 관용 표기, 예: 메이크스타→Makestar, 위로보틱스→WIRobotics) — ''최후 폴백'''
        precision_guard:
        - 음역·로마자 변형 매치는 confirmed_entity가 아니라 provisional_entity_candidate를 생성한다 (entity_resolution 참조) — 기사는 회수·본문 fetch·검증되며, 검증 실패 시에만 wrong_entity
          discard
        - '짧거나 일반어와 충돌하는 음역(예: ''Wad'', ''Oasis'')도 provisional 경로를 타되 검증 문턱이 높다 — 산업·제품 문맥 신호 없이는 confirmed 승격 불가'
        - 검증 확정된 영문 표기는 alias_feedback으로 english_aliases 등록 제안 — 폴백 의존을 점진적으로 줄이는 피드백 루프
        rule: 폴백은 recall 장치, entity gate는 그대로 — false positive 통제는 검색 차단이 아니라 entity_resolution 검증 단계가 담당한다. '검색 성공 → gate 기각 → 소멸' 경로는 v4.4에서
          존재하지 않는다
  event_qualified_queries:
    purpose: entity 단독 검색은 주가 기사·구 뉴스·반복 PR·실적 코멘터리·SEO 페이지에 포화될 수 있다(search-result saturation). 고우선 사건군에 대해 entity + 사건어 조합 쿼리를 백스톱으로 추가한다
    rule: 'entity 기반 발견을 대체하지 않는다. 두 경로를 모두 실행: (1) entity-based discovery (2) high-priority event-qualified discovery'
    ko_templates:
    - company + IPO terms (상장 OR 예비심사 OR 공모 OR 기술성평가 OR IPO)
    - company + dilution terms (유상증자 OR 전환사채 OR CB OR 보호예수 OR 의무보유 OR 블록딜)
    - company + technology terms → technology_recall_query_families 사용 (P0-2)
    - company + clinical/regulatory terms (임상 OR 식약처 OR FDA OR 허가)
    - company + financing terms (투자유치 OR 시리즈 OR 펀딩 OR 라운드 OR 조달 OR 브릿지 OR 프리IPO OR 클로징 OR 투자완료)
    - company + M&A terms (인수 OR 합병 OR 매각 OR 우선협상대상자 OR 본계약 OR 무산 OR 철회)
    - company + earnings terms (영업손실 OR 영업이익 OR 적자 OR 흑자전환 OR 감사보고서 OR 매출)
    - company + commercialization terms (수주 OR 공급계약 OR 양산 OR 납품)
    - company + negative terms (해지 OR 소송 OR 과징금 OR 유출 OR 구조조정)
    english_templates:
      ipo: '"IPO" OR listing OR "preliminary review" OR prospectus OR "registration statement" OR bookbuilding OR pricing OR underwriter OR withdrawal'
      dilution_capital: '"rights offering" OR "private placement" OR "follow-on offering" OR "convertible bond" OR "convertible note" OR warrant
        OR conversion OR repricing OR "lock-up expiration" OR "secondary sale" OR "option grant" OR RSU OR "authorized shares"'
      financing: funding OR financing OR "Series A" OR "Series B" OR "Series C" OR "Series D" OR "investment round" OR "financing round" OR "bridge
        round" OR round OR raise OR raises OR raised OR closing OR closes OR "equity financing" OR "venture debt" OR "credit facility" OR "term
        loan"
      commercialization: '"design win" OR qualification OR "customer validation" OR "volume production" OR "supply agreement" OR deployment OR
        adoption'
      negative: terminated OR cancelled OR delayed OR failed OR suspended OR discontinued OR recall OR "regulatory action" OR layoffs
      technology: → technology_recall_query_families의 영문 패밀리 사용
    technology_recall_query_families:
      generation_rule: 이 패밀리들은 technology_milestone·technology_setback 온톨로지에서 결정적 빌드 스텝으로 '생성·동기화'된다 (수기 별도 관리 금지)
      semiconductor:
        positive_ko: 테이프아웃 OR 수율 OR 샘플검증 OR 엔지니어링샘플 OR 성능검증 OR 양산준비
        positive_en_1: tapeout OR "tape-out" OR "first silicon" OR "silicon bring-up" OR "engineering sample"
        positive_en_2: qualification OR yield OR "performance validation" OR "design win" OR "mass-production readiness" OR "customer validation"
        setback_ko: 수율문제 OR 수율저하 OR 샘플결함 OR 리스핀 OR 테이프아웃연기
        setback_en: respin OR "yield issue" OR "qualification failed" OR "sample defect" OR "missed target"
      ai_software:
        positive_ko: 파운데이션모델 OR 벤치마크 OR 정확도개선 OR 지연시간단축 OR 추론비용 OR 오픈소스공개
        positive_en_1: '"foundation model" OR benchmark OR SOTA OR "state-of-the-art" OR accuracy'
        positive_en_2: latency OR "inference cost" OR architecture OR "model release" OR "open-source" OR deployment
        setback_ko: 성능미달 OR 벤치마크미달 OR 서비스중단 OR 개발중단 OR 학습실패
        setback_en: underperforms OR "missed performance" OR "service discontinued" OR "training failure"
      bio_preclinical:
        positive_ko: 후보물질 OR 리드물질 OR 전임상 OR 비임상 OR GLP OR 독성시험 OR CMC OR 제조공정 OR 제형개발 OR 바이오마커 OR 동물모델 OR 약효
        positive_en_1: '"lead candidate" OR "lead optimization" OR preclinical OR nonclinical OR "IND-enabling"'
        positive_en_2: GLP OR tox OR CMC OR "PK/PD" OR biomarker OR formulation OR "manufacturing process"
        setback_ko: 독성문제 OR 전임상실패 OR 공정차질 OR CMC차질
        setback_en: '"toxicity finding" OR "preclinical failure" OR "CMC issue" OR "manufacturing setback"'
      robotics:
        positive_ko: 프로토타입 OR 자율보행 OR 자율주행 OR 가반하중 OR 보행속도 OR 구동시간 OR 필드테스트 OR 실증 OR 안전인증 OR 양산준비
        positive_en: '"prototype completed" OR "autonomous operation" OR payload OR "field test" OR "pilot deployment" OR "safety validation"'
        setback_ko: 실증실패 OR 안전인증불발 OR 필드테스트중단
        setback_en: '"field test halted" OR "safety certification failed" OR "pilot failure"'
      battery_materials:
        positive_ko: 에너지밀도 OR 사이클수명 OR 수명개선 OR 파일럿라인 OR 파일럿생산 OR 샘플인증 OR 고객사검증 OR 양산공정 OR 전해질성능
        positive_en: '"energy density" OR "cycle life" OR "pilot line" OR "sample qualification" OR "process validation" OR yield'
        setback_ko: 파일럿중단 OR 수율문제 OR 화재 OR 결함 OR 리콜
        setback_en: '"pilot halted" OR "cell defect" OR fire OR recall'
      general_technology:
        positive_ko_1: 개발완료 OR 개발성공 OR 기술검증 OR 성능검증 OR 검증완료 OR 개념검증 OR 프로토타입 OR 시제품 OR PoC OR 실증
        positive_ko_2: 성능개선 OR 정확도개선 OR 처리속도개선 OR 비용절감 OR 자동화 OR 기술상용화 OR 핵심기술
        positive_en_1: prototype OR "proof of concept" OR validation OR pilot OR "technical milestone"
        positive_en_2: '"performance improvement" OR "accuracy improvement" OR "latency improvement" OR "cost reduction" OR "technical validation"'
        setback_ko: 지연 OR 연기 OR 중단 OR 보류 OR 차질 OR 실패 OR 미달 OR 기술적문제 OR 기술문제
        setback_ko_note: 광폭 단어지만 검색은 항상 '회사명 AND 용어'로 실행되므로 회수 정밀도는 entity 조건이 방어. 분류 정밀도는 technology_setback. context_guard(기술 대상어 공기)가 그대로 담당
          — 배송지연 등은 회수돼도 setback으로 분류되지 않고 company_update로 보존 (T064)
        setback_en: '"development delay" OR "failed validation" OR "technical issue" OR "missed performance target" OR "development halted"'
        note: 핀테크 결제 아키텍처·헬스케어 진단 정확도·커머스 물류 자동화·컨슈머 공정 혁신·콘텐츠 제작 기술 등 특화 5개 산업 밖 기술 발전의 anti-saturation 백스톱. 분류는 기존 technology_milestone/technology_setback이
          담당
      execution_rule: technology_recall_family_mapping으로 결정된 패밀리를 실행. 각 쿼리는 컴팩트하게 유지 — 검색엔진 연산자 한도·정밀도 저하를 피하기 위해 패밀리를 쪼개 실행한다
    technology_recall_family_mapping:
      semiconductor:
      - semiconductor
      - general_technology
      ai_software:
      - ai_software
      - general_technology
      bio_drug:
      - bio_preclinical
      - general_technology
      robotics:
      - robotics
      - general_technology
      battery:
      - battery_materials
      - general_technology
      healthcare:
      - general_technology
      fintech:
      - general_technology
      commerce:
      - general_technology
      consumer:
      - general_technology
      content:
      - general_technology
      rules:
      - 복수 industry 회사는 해당 패밀리들의 '합집합'을 실행 — 동일 패밀리 중복 실행 금지 (general_technology는 어떤 조합에서도 정확히 1회)
      - 'CI 계약(TECH11): company_rules에 등장하는 모든 industry 값은 이 매핑에 존재해야 하며 최소 1개 패밀리로 해석돼야 한다. 미매핑 industry = CI 실패. 새 industry 추가 시 매핑 추가가 강제된다'
    capital_structure_recall_query_families:
      new_issuance:
        ko: 유상증자 OR 신주발행 OR 제3자배정 OR 주주배정 OR 일반공모증자 OR 유증 OR 출자전환
        en: '"rights offering" OR "private placement" OR "follow-on offering" OR "share issuance" OR PIPE OR "debt-to-equity"'
      dilutive_securities:
        ko: 전환사채 OR CB OR 신주인수권부사채 OR BW OR 교환사채 OR EB OR RCPS OR 전환우선주
        en: '"convertible bond" OR "convertible note" OR warrant OR "convertible preferred"'
      conversion_repricing:
        ko: 전환청구 OR 전환권행사 OR 신주인수권행사 OR 리픽싱 OR 전환가액 OR 전환가격
        en: conversion OR "conversion price" OR "warrant exercise" OR repricing
      equity_compensation:
        ko: 스톡옵션 OR 주식매수선택권 OR RSU OR 주식보상
        en: '"stock option" OR "option grant" OR RSU OR "restricted stock"'
      overhang_supply:
        ko: 보호예수 OR 의무보유 OR 락업 OR 블록딜 OR 구주매출 OR 오버행
        en: '"lock-up" OR lockup OR overhang OR "secondary sale" OR "block deal"'
      issuance_capacity:
        ko: 발행가능주식총수 OR 발행예정주식총수 OR 수권주식수 OR 신주발행한도 OR CB발행한도 OR BW발행한도
        en: '"authorized shares" OR "authorized capital"'
      dilution_reduction:
        ko: 소각 OR 유상증자철회 OR 스톡옵션취소
        en: '"convertible cancellation" OR "share cancellation" OR "offering withdrawn" OR "buyback and cancellation"'
        note: 소각은 검색어로는 광폭 허용(회사명 AND 조건이 정밀도 방어) — 분류 단계의 context_required(주식·CB 공기)는 그대로 적용
      execution_rule: 전 회사 실행 (상장·비상장 무관 — 상장사는 DART 폴링과 중복 발견 시 dedup이 흡수). 각 패밀리는 별도 컴팩트 쿼리로 실행
    ontology_sync_contract:
      scope:
      - technology_milestone
      - technology_setback
      - capital_structure_dilution
      - financing
      - ma
      - earnings
      rule: scope 패밀리의 분류 어휘에 존재하는 모든 용어는 (a) 대응 recall 쿼리 패밀리에 커버되거나 (b) exclusions에 명시적 사유와 함께 등재되어야 한다. 둘 다 아니면 CI 실패 (silent absence 금지)
      coverage_semantics:
        normalization:
        - 'KO: 공백 제거 후 비교 (core_logic.normalization과 동일)'
        - 'EN: 소문자화, 하이픈→공백, 연속 공백 축약, 말미 단수화(-s/-es 제거)'
        ko_coverage: '쿼리 용어가 정규화된 온톨로지 용어의 ''부분문자열''이면 커버. 예: 쿼리 ''바이오마커''는 온톨로지 ''바이오마커검증''을 커버한다 (검색어 바이오마커가 해당 기사를 회수하므로). 역방향은 불성립 — 쿼리 ''바이오마커검증''은
          온톨로지 ''바이오마커''를 커버하지 않는다'
        en_coverage: '쿼리 용어의 전 토큰이 온톨로지 구(phrase)의 토큰 집합에 포함되면 커버. 예: 쿼리 qualification은 온톨로지 ''customer qualification''을 커버. 쿼리 ''customer qualification''은
          온톨로지 qualification을 커버하지 않는다 (더 좁은 검색어는 더 넓은 개념을 회수하지 못함)'
        direction: 판정 방향은 항상 '이 쿼리가 그 용어의 기사를 회수할 수 있는가'
      family_selector_map:
        technology_ko: technology_recall_query_families.*.{positive_ko,setback_ko}
        technology_en: technology_recall_query_families.*.{positive_en*,setback_en}
        general_technology_ko: technology_recall_query_families.general_technology.{positive_ko_1,positive_ko_2,setback_ko}
        capital_structure_ko: capital_structure_recall_query_families.*.ko
        capital_structure_en: capital_structure_recall_query_families.*.en
        financing_ko: ko_templates[financing terms]
        financing_en: english_templates.financing
        ma_ko: ko_templates[M&A terms]
        earnings_ko: ko_templates[earnings terms]
        none: not_a_retrieval_term — 검색 대상이 아님을 명시하는 사유
      ci_binding_rule: CI는 exclusions[].family를 family_selector_map으로 해소한 뒤, 해당 셀렉터가 가리키는 실제 쿼리 문자열에 그 term이 없음을 확인한다. family가 map에 없거나 셀렉터가 0개
        쿼리에 매칭되면 CI 실패 (미해소 예외가 조용히 통과하던 경로 차단)
      exclusions:
      - term: 검증
        family: technology_ko
        reason: 단독 검색 정밀도 파괴 — 기술검증·성능검증·검증완료·샘플검증 복합어로 커버
      - term: 수율
        family: technology_ko
        reason: semiconductor·battery positive_ko에 포함되어 있음 — 여타 산업 쿼리에는 단독 정밀도 문제로 제외 (general_technology 미포함 사유 기록)
      - term: 파일럿
        family: general_technology_ko
        reason: 단독으로는 항공 등 무관 기사 다수 — EN pilot은 포함(AND 회사명 조건), KO는 파일럿라인·파일럿생산 복합어(battery)와 실증(일반)으로 커버
      - term: reset
        family: capital_structure_en
        reason: 범용어 — 검색 정밀도 파괴. 분류 단계 context_required로만 사용, 검색은 repricing·conversion price가 동일 기사를 회수
      - term: customer
        family: technology_en
        reason: 단독 무의미 — customer validation 구 단위로 커버
      - term: CPS
        family: capital_structure_ko
        reason: 초단축 약어 검색 충돌 — RCPS·전환우선주가 실질 동일 기사를 회수
      - term: 따상
        family: none
        reason: downgrade marker — 검색 대상 아님 (사건 어휘가 아니라 노이즈 마커)
      - term: 대주주지분매각
        family: capital_structure_ko
        reason: ma 패밀리 검색(매각)과 overhang(구주매출·블록딜)이 실질 동일 기사를 회수 — 별도 쿼리 추가는 중복
      - term: 양도제한조건부주식
        family: capital_structure_ko
        reason: 국내 보도 관행상 RSU 병기 — equity_compensation 쿼리(RSU·주식보상)가 동일 기사를 회수
      - term: 유치
        family: financing_ko
        reason: 단독 검색 정밀도 파괴(관광객 유치 등) — 투자유치가 실질 동일 기사 회수
      - term: 기업가치
        family: financing_ko
        reason: 밸류 코멘터리 노이즈 — 라운드·투자유치·조달 쿼리가 파이낸싱 기사를 회수, 기업가치 단독 기사는 entity 검색+캐치올이 보존
      - term: 밸류
        family: financing_ko
        reason: 기업가치와 동일 사유
      - term: 몸값
        family: financing_ko
        reason: 기업가치와 동일 사유
      - term: 수혈
        family: financing_ko
        reason: 은유 표현 — 해당 기사는 거의 항상 조달·투자·억 동반, 동기 쿼리가 회수
      - term: 프리PO
        family: financing_ko
        reason: 프리IPO 오기 변형 — 분류기만 유지, 검색은 프리IPO가 커버
      - term: 투자완료
        family: financing_ko
        reason: 쿼리 포함됨(ko_templates) — 중복 등재 아님을 명시하는 참조 엔트리
        covered: true
      ci_check: 결정적 빌드 스텝이 (온톨로지 용어 전수) × (쿼리 패밀리 ∪ exclusions)를 coverage_semantics로 diff — pytest 실행, 미커버·미등재 용어 발견 시 실패. exclusions의 term이 온톨로지에서
        제거되면 stale 엔트리 경고
    prioritize_backstops_for:
    - ipo
    - capital_structure_dilution
    - technology_milestone
    - technology_setback
    - regulatory_clinical
    - ma
    - financing
    - customer_or_contract_loss
    scheduling_note: 전 회사 × 전 템플릿 상시 실행이 비용상 어려우면 상장사·고뉴스볼륨 회사부터 적용하고, 나머지는 주기 완화 실행 — 단 '주기 완화'는 허용되어도 '패밀리 누락'은 허용되지 않는다
    fresh_window_rule: '짧은 최근 윈도우에서 event-qualified 검색은 역사 윈도우보다 성능이 나쁘다 (실측 1/3 vs 6/10): 검색엔진이 과거 유명 사건을 최신 결과 위에 반환(retro-saturation)하고 최근
      2~3주는 색인 지연. 따라서 일일 운영에서는 DART/KIND 직접 폴링이 검색에 ''선행''해야 하며(색인 지연 없는 유일 계층), 검색 결과의 창 내 판정은 fetch 날짜 검증 필수 (실측 후보 13건 중 10건이 창 밖 — 77% FP).
      v4.4.2 시절 ''역사 결과가 운영 성능을 과소평가한다''는 결론은 반대였다'
  snippets:
    required_for_judging: true
  body:
    fetch_when:
    - title_is_ambiguous
    - company_name_absent_from_title
    - event_type_unclear
    - rumor_vs_confirmed_unclear
    - dilution_certainty_unclear
    - grant_or_capacity_size_unclear
    - setback_materiality_unclear
  external_impact_queries:
    enabled: true
    mode: shadow
    source: company_rules.*.external_exposures
    registry_key: normalized exposure subject
    one_exposure_subject_per_query: true
    deduplicate_shared_subjects_before_search: true
    apply_allowed_event_families: true
    apply_required_event_context: true
    apply_jurisdiction_and_geography_guards: true
    do_not_use_broad_industry_terms_as_standalone_query: true
    attach_company_after_event_cluster: true
implementation_mapping:
  deterministic_code:
  - query_generation (legal_name 포함 전 소스, forbidden_standalone·context_terms 제외)
  - event_qualified_queries 생성·스케줄링 (LEAK-22)
  - 'source_collection 직접 폴링: OpenDART/KIND API, 뉴스룸 RSS, ClinicalTrials.gov, KIND 의무보유등록·보호예수 현황 캘린더 수집 (LEAK-20)'
  - normalization / entity gate step_1 전체 / clinical regex / blocked_domains
  - context_required_events 공기 검사 (수요예측·청약·CB·BW·reset·유증·소각·RSU· 기술성평가·setback 범용어) + negative_context 검사 (유증↔상속)
  - 'P0-4: 영문 모니터링 — enhanced ''깊이''만 structured field로 평가한다. 영문 모니터링 ''활성화 여부''는 평가 대상이 아니다: baseline은 전 포트폴리오 회사에 무조건 켜져 있다. 온보딩 메타데이터로 on/off를
    판정하는 구현은 금지 (구 english_auto_enable 로직 재현 = 회귀 실패)'
  - duplicate_handling 키 생성 — event_subtype + transaction_identity 판별자 추출 (DART 접수번호 파싱, 'n회차' 회차 추출, 금액 정규화) (LEAK-23)
  - capital_structure_direction 1차 할당 — mapping 사전 기반 결정적 매핑, 모호 사례만 judge 최종 판정 (LEAK-17)
  - event_output 구조 조립 — event_types 리스트·primary_event 선택 (ranked_impact_order + ipo_integral 예외) (LEAK-9)
  - company_update 캐치올 라우팅 — entity 성립 + 이벤트 미매치 기사를 discard가 아니라 normal/retain으로 파이프라인에 투입 (ARCH-1)
  - 전 포트폴리오 뉴스룸/블로그 RSS 폴링 + partner_watch 상대방 뉴스룸·와이어 폴링 (ARCH-8)
  - '선택 기술 소스 수집: GitHub releases·arXiv·Hugging Face·학회 프로시딩 (조직명 결정적 매치)'
  - retention 필드 부여 + retain_collapsed 그룹핑 (반복 PR 유사도 클러스터, passing-mention)
  - 'accumulation_rules 카운터: 회사×테마 타임윈도우 카운터, 임계 도달 시 judge 승격 검토 큐 (ARCH-9)'
  - 인사·해지·분할·장애·유출 등 신규 범용어 context_required 공기 검사 (ARCH-4)
  - '검색 recall 심화: 날짜 윈도우 분할 + 페이지네이션 (고볼륨 회사 포화 방어)'
  - 'P0-1: 전 회사 baseline 영문 쿼리 생성 + entity_discovery_fallback (라틴 alias → 웹사이트 메타데이터 → 공식 소스 영문 표기 → 로마자 변형 순)'
  - 'P0-2: 온톨로지→technology_recall_query_families 결정적 빌드 + CI 커버리지 diff (ontology_sync_contract — 분류 어휘가 검색층에서 조용히 빠지면 테스트 실패)'
  - 'P0-3: detected/material 이중 태그 저장 + 카테고리별 히스토리 인덱스 (희석 이력·IP 이력·기술 타임라인 조회 API는 detected 기준)'
  - 'P0-4: lossless_collection — 소스별 워터마크 저장소, 성공 처리 후 전진, 중첩 윈도우, 워터마크 도달까지 페이지네이션, 백오프 재시도, 장애 백필, 소스 헬스 경보'
  - 'P1-1: partner_graph 상태 머신 + 후보 제안 트리거 (공기 카운터·공식 소스 감지)'
  - 'P1-3: technical_review 신호 감지 (수치 변화 패턴·미등록 식별자·미등록 용어 검출은 결정적 1차 스크리닝, 최종 플래그는 judge)'
