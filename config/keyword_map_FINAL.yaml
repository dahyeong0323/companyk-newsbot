source_collection:
  principle: 검색엔진 수집(search-engine retrieval)은 보조 수단(supplement)이며, 고가치 1차 소스의 유일한 수집 방법이어서는 안 된다. DART 전용·KIND 전용·뉴스룸 전용·임상 레지스트리 전용·규제기관 전용
    사건은 일반 검색 결과에 뜨지 않거나 뒤늦게 뜬다 — source_priority(랭킹)와 별개로 아래 소스를 직접 폴링한다
  listed_korean:
    direct_poll:
    - DART
    - KIND
    kind_irreference:
      trigger: IR자료 발행빈도 ÷ 보도자료 발행빈도 비율이 임계 이상인 회사만 활성화 (IR로 말하고 PR로 말하지 않는 프로파일 — 지투지바이오 유형)
      primary_value: 사건 '탐지'가 아니라 forward guidance 추출 — 마일스톤 캘린더· 학회 발표 예정·IND/CTA 제출 분기 등 committed_milestone_tracking의 최상급 입력원. 뉴스에 선행하는 것은
        사건이 아니라 '예고'다
      implementation_constraint: 'BT4 실측: irReference 디렉터리는 GET으로 빈 폼만 반환 — POST 파라미터 또는 KRX OpenAPI 필요. 개별 PDF는 URL 패턴으로 접근 가능(검증: seq 17802·17790
        fetch 성공), IRGO(m.irgo.co.kr)가 미러 열거 인덱스로 유효. ''irReference를 폴링한다''를 문자 그대로 구현하면 조용히 실패한다 — 이 제약 명시 없이는 배포 금지'
      watermark: 활성화된 회사는 PDF 본문 파싱 + 섹션 워터마크 유지 (기존 규칙 유지)
    note: 자본구조 사건(유증·CB·BW·전환청구·리픽싱·보호예수/의무보유·수권주식·스톡옵션)과 IPO 절차(예심·증권신고서·공모)는 공시 직접 폴링이 1차 수집 경로
