false_positive_watchlist:
- term: 수요예측
  risk: 전력/트래픽/AI 수요예측 기사 — context_required(공모·상장·IPO)로 방어했으나 핀테크·AI 회사 기사에서 경계 사례 발생 가능
- term: 청약
  risk: 아파트 청약 — context_required(공모·상장)로 방어
- term: CB/BW/EB
  risk: 영문 약어 충돌(방송사 CB 등) — 발행·조달·억 공기 조건으로 방어
- term: conversion/reset/warrant
  risk: 영어 범용어 — 패턴 공기 조건으로 방어. 영문 모니터링 회사에서만 노출
- term: 스톡옵션행사
  risk: 상장사 루틴 소액 행사 다발 — materiality(규모·비율) 판정을 judge에 위임
- term: 개발성공/개발완료/검증완료
  risk: 자사 PR 남용 단어 — importance_criteria(수치·외부검증) 미충족 시 normal 강제
- term: 프로토타입/PoC/파일럿
  risk: 동일 — 루틴 PR 승격 방지 기준이 실질 방어선
- term: 대주주지분매각
  risk: ma 패밀리와 중복 매치 — event_output이 두 태그를 보존하고 primary만 단일화, 이중 발송 방지는 dedup가 담당
- term: 유증
  risk: 遺贈(상속 증여)·유증 분쟁 기사와 동음이의 — context_required(신주·발행·조달·억·원· 배정) + negative_context(상속·유언·유류분)로 이중 방어
- term: 기술성평가/기술평가
  risk: 정부 R&D 과제 평가·일반 기술평가와 충돌 — IPO 문맥(상장·기술특례·코스닥· 예비심사·IPO) 공기 필수로 방어. 미공기 시 ipo 매치 불성립
- term: 지연/연기/중단/보류/실패/차질/미달
  risk: 극도로 범용적 어휘(배송지연·행사연기·공연연기) — context_guard(기술·개발 대상어 공기 필수)로 방어. delayed/postponed/suspended 영문도 동일
- term: 소각
  risk: 폐기물 소각 기사 — context_required(주식·자사주·CB·전환사채·사채)로 방어
- term: 정관변경
  risk: 사명변경·사업목적 추가 등 일반 안건 — authorized_capacity는 자본 관련 토큰 공기 필수(패턴 매치)로 방어, 단독 매치 불성립
- term: 스톡옵션부여/RSU
  risk: 루틴 소액 부여 다발 — 1% 미만 부여 normal 강제로 알림 피로 방지. RSU는 context_required로 약어 충돌 방어
- term: 계획/목표 (IPO)
  risk: expectation 어휘 확대로 정당한 urgent 사건이 하향될 위험 — schedule_not_rumor 예외와 stage_priority.urgent 층이 방어 (예심청구 이후 절차는 expectation 어휘와 무관하게 urgent)
- term: detected_event_types 다중 태그
  risk: P0-3으로 normal급도 detected에 태그되므로 태그량 증가 — 알림 인플레이션은 material_event_types 분리로 통제 (알림·대시보드 하이라이트는 material만). detected는 히스토리 조회 전용이라 노이즈
    비용이 낮음
- term: 영문 baseline (음역 검색)
  risk: 로마자 변형 검색(Makestar·WIRobotics 등)이 동명 외국 기업과 충돌 가능 — 음역은 검색어로만 사용, entity 확정은 기존 매치 규칙 + judge 검증. 짧은/일반어 음역은 forbidden_standalone 준용.
    유효 확인된 표기는 english_aliases로 승격해 폴백 의존 축소
- term: technical_review_candidate
  risk: 과플래그 시 심층 판정 비용 증가 — 수치·식별자·용어 신호를 기술 문맥 공기와 결합해 1차 결정적 스크리닝, 플래그돼도 알림은 발생하지 않음(큐 라우팅만)
- term: partner_graph candidate
  risk: 오탐 상대방이 그래프 오염 — 단일 기사 자동 등록 금지·운영자 승인· inactive 상태로 재제안 억제
- term: 중첩 수집 윈도우
  risk: 재수집 문서의 중복 이벤트 생성 — duplicate_handling(문서 ID·transaction_identity) 이 흡수, L4 회귀로 고정
- term: Olix (영문)
  risk: 영국 AI칩 스타트업 Olix($3.3B) — 올릭스 영문 financing 알림 오탐 1순위. english_negative_context + 단축형 required 문맥으로 방어 (V441-1)
- term: 채용포털·시세포털 도메인
  risk: KO entity 검색 결과 30~50% 점유 실측 — blocked_domains_global 후처리로 제거. 뉴스 섹션 보유 도메인 오차단 주의 (예외 등록 경로 유지)
- term: silence_monitoring
  risk: 저신호가 '정상'인 회사(아이랩·메디노 등 low_media_signal_is_expected)에 과경보 — 기대-신호 프로파일(직전 대형 활동 이력) 조건으로 한정
- term: valuation_signal
  risk: 밸류 미공개 라운드를 down_round로 추정하는 오류 — unknown 강제, 추정 금지
- term: 대출/차입 (부채 계열)
  risk: 뱅크샐러드는 대출비교 '사업자' — 자사 서비스 기사가 debt financing으로 오분류되는 최악 충돌. 대출 단독 뉴스 어휘 금지, 차입은 공시 문서 내부 한정, 벤처대출· venture debt·credit facility·term
    loan 4개만 뉴스 협의 허용 (debt_financing_minimal)
- term: 등기부 지연 제출
  risk: Companies House 제출 지연 실측(PSC07 2년, SH01 12개월) — filed_date로 기록하면 과거 사건이 신규 사건처럼 발화. effective_date 기준 기록 + 소급 삽입 + 뉴스 계층 선행 포착분과 dedup
    병합으로 방어
- term: 라운드/조달/클로징/브릿지 (financing 확장)
  risk: 골프 라운드(보이스캐디 포트폴리오와 직접 충돌!)·정부조달·부동산 클로징·교량 — financing.context_required_events로 방어. 특히 보이스캐디 기사에서 '라운드'는 투자 문맥 토큰 없이 절대 매치 불가 (V442-1
    대조 참조)
- term: 출자전환
  risk: 이중 효과 서술 누락 — 희석만 강조한 순부정 서술 또는 채무감소만 강조한 순긍정 서술 모두 실패. dual_effect_rule로 방어
- term: official_company_sections 확장
  risk: 공고·법적고지 페이지의 비사건 문서(채용공고·개인정보방침 개정) 유입 — 캐치올 normal/retain_collapsed로 흡수, 판정 비용은 섹션별 변경 감지로 제한
- term: 선임/영입/사임/합류/교체
  risk: 인사 범용어 — 수상자 선임·홍보대사 위촉 등과 충돌. context_required(임원·직책 토큰 공기)로 방어, 실무급은 normal 강제
- term: 해지/계약종료
  risk: 보험 해지·구독 해지 소비자 기사 — context_required(계약·공급·수주·고객·파트너)로 방어. 자연 만기 vs 중도 해지는 judge 판정
- term: 분할
  risk: 재산분할·판결 기사 — context_required(물적·인적·법인·사업부)로 방어
- term: 장애/유출
  risk: '''장애인 고용''·''인재 유출'' 등 무관 문맥 — context_required(서비스·시스템/ 개인정보·데이터)로 방어'
- term: restructuring (EN)
  risk: 재무 구조조정과 인력 구조조정 이중 의미 — 인력 토큰 공기 조건 + judge 구분. 어느 쪽이든 투자자 관련성은 있어 수집은 유지
- term: 과징금/제재
  risk: 업계 일괄 제재 기사에 회사가 스치듯 언급 — passing_mention 처리로 과알림 방지
- term: 출원
  risk: 다량 출원 기업의 피드 범람 — normal + retain_collapsed 다이제스트로 제어
- term: company_update 캐치올
  risk: '가장 큰 신규 리스크 — entity 매치만으로 보존되므로 리스트 기사·시황 기사가 피드에 유입. 통제: (1) entity gate 보호장치 무변경 (2) passing_mention → retain_collapsed (3) notification
    절대 없음 (4) important 승격 금지 (5) 주간 다이제스트로만 노출. 피드 품질 저하 시 운영자가 collapsed 기준 강화'
- term: 채용/채용확대
  risk: 루틴 채용 홍보 다발 — normal + 다이제스트, 급증·급감 추이만 accumulation 신호
preserved_protections:
- strict_entity_matching
- forbidden_standalone_handling
- negative_term_substring_protection
- context_terms_not_qualifying_as_entities
- stock_move_only_downgrade
- unsupported_speculation_downgrade
- routine_pr_filtering
- english_entity_normalization
- context_required_handling_for_ambiguous_abbreviations
- source_quality_preference
- state_transition_based_materiality
- term: external-impact route
  risk: 회사명이 없는 외부 뉴스를 잡기 위해 entity gate를 느슨하게 하면 기존 precision 붕괴. v4.5는 direct route entity_match_required=true를 그대로 보존하고 external route를 별도
    shadow 경로로만 추가한다.
deprecated_terms:
  english_auto_enable:
    deprecated_historical_reference: true
    replaced_by: 'english_monitoring: {baseline: always_on, enhanced: metadata_driven}'
    rule: changelog(v4.0~v4.3)의 언급은 historical 기록으로만 유효. 어떤 활성 규칙도 온보딩 메타데이터로 영문 모니터링 자체를 조건화할 수 없다
  ignore:
    deprecated_historical_reference: true
    replaced_by: 'notification_priority: none + material_event_types: [] + retention(retain/retain_collapsed/discard) + discard_reason'
    rule: 'ignore는 어떤 활성 규칙에서도 결정 상태가 아니다. 레거시 테스트의 expected_priority: ignore는 ''notification: none''으로 읽고 retention은 expected_retention 필드를 따른다
      (T016/T032/T040은 discard_reason 명시로 번역됨). 유일한 완전 폐기 경로는 pipeline.discard_only_if의 5가지 사유'
  event_types:
    deprecated_historical_reference: true
    replaced_by: detected_event_types(전체) + material_event_types(important+)
    rule: event_types는 material_event_types의 읽기 전용 별칭으로만 존속
known_limitations:
- 회사를 어떤 알려진 표기로도 지칭하지 않는 기사('한 국내 AI 스타트업이…', '모 반도체 팹리스가…')는 entity가 성립할 수 없어 발견 불가 — partner·산업 문맥으로 우연히 잡히는 경우만 커버
- '제3언어(일본어·중국어 등) 매체 단독 보도는 미커버 — 예: 일본 사업 비중이 큰 회사의 일본 현지 보도는 KO/EN 매체가 받아쓸 때까지 지연. (필요 시 회사별 제3언어 확장이 자연스러운 다음 단계 — 이번 범위 밖)'
- 페이월·비공개 채널(유료 뉴스레터, 비공개 커뮤니티, LinkedIn 비공개 포스트, Discord/Slack)은 수집 대상이 아님 — 공개된 2차 인용이 나타날 때만 발견
- 발행되지 않은 정보(이사회 내부 논의, 비공개 계약)는 정의상 범위 밖 — 이 시스템은 공개 정보 인텔리전스다
- '로마자 변형 폴백은 유한한 표기 집합 — 비정상 표기(예: 임의 축약, 오탈자 표기)로만 언급된 영문 기사는 놓칠 수 있음. english_aliases 피드백 루프가 점진 완화'
- 검색엔진이 색인하지 않은 페이지는 쿼리로 발견 불가 — direct_poll 등록 소스만 색인 독립적. 새로 생긴 중요 소스는 운영자가 등록해야 함
- 온톨로지·technical_review 휴리스틱 밖의 미묘한 기술 신호(수치 없는 정성 서술)는 company_update로 보존은 되지만 심층 판정 큐에 오르지 못할 수 있음
- accumulation 임계값 미만의 느린 악화(장기간 1건씩)는 normal로 남는다 — 임계값은 운영 튜닝 대상
- partner_graph는 반복 공기·공식 소스 기반 — 단 한 번 언급되고 끝난 관계는 verified로 승격되지 못하며 해당 상대방의 후속 단독 발표는 놓칠 수 있음
- judge 오분류 잔존 리스크 — 골든셋 회귀로 감시하지만 0이 되지 않음. 보존 아키텍처 덕에 오분류돼도 기록 자체는 피드에 남는 것이 방어선
- '미국 법인 소유·지배 구조: 무료 공적 등기 부재 검증(Delaware 비공개) — KaliVir의 주주 변동은 자발 공개·파트너 공시 외 deterministic 경로 없음'
- '등기부 적시성: Companies House 제출 지연 실측 최대 2년 — 등기 계층은 권위적 사후 확인 계층이지 실시간 탐지 계층이 아님'
- '지자체 공공기록: board-native 폴링을 설정한 프로젝트만 커버 — 미등재 지자체· 비공개 행정 절차는 불가시. 세움터는 주소 키 필요(주소 미상 프로젝트 불가)'
- SG 등기 상세는 유료 — 조회 주기가 예산에 종속
- 정부사업 결과 중 부처 내부 확정~공고 게시 사이의 시차, 비공개 협약 조건
- Route A cannot detect articles with no portfolio-company entity. Route B can detect such articles only when a pre-registered, time-valid external
  exposure and qualifying material event are present. Events outside the exposure registry remain undiscoverable.
- 외부 exposure 자체가 공개/내부적으로 등록되지 않은 관계는 Route B가 알 수 없음. broad industry 추론으로 자동 보완하지 않음 — precision 우선.
