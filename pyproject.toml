[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "companyk-newsbot"
version = "0.1.0"
description = "Company K portfolio news bot"
requires-python = ">=3.12"
dependencies = [
  "feedparser>=6.0,<7",
  "httpx>=0.27,<1",
  "openai>=1.0,<3",
  "pydantic>=2.8,<3",
  "PyYAML>=6.0,<7",
]

[project.scripts]
companyk-newsbot = "companyk_newsbot.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
